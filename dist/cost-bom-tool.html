  const palette=['#168F9A','#B66B3F','#8B7953','#5678B3','#9A6287','#749C45','#BF688B','#55736D','#9C7533','#487BA4','#995B4E','#765F94'];
  const seed=new Set(aggregateBom(project).map(row=>reviewDomainLabel(partAttributes(project,row.partNumber))));
  for(const change of project.changes || [])if(!change.deletedAt)for(const item of change.items || [])seed.add(reviewDomainLabel(changeItemAttributes(project,item)));
  const sequence=sortLabels(seed).concat(sortLabels(Array.from(labels).filter(label=>!seed.has(label))));
  const colors=new Map(Object.entries(fixed)),used=new Set(Object.values(fixed));
  for(const label of sequence){
    if(colors.has(label))continue;
    let hash=0;for(const ch of label)hash=(Math.imul(hash,31)+ch.codePointAt(0))>>>0;
    let color=palette[hash%palette.length];for(let i=0;i<palette.length;i++){const candidate=palette[(hash+i)%palette.length];if(!used.has(candidate)){color=candidate;break;}}
    colors.set(label,color);used.add(color);
  }

}
function reviewChartDomains(project, rows) { return reviewDomains(project,rows); }

const REVIEW_CHANGE_KINDS = [
  {key:'product', label:'产品变更'}, {key:'styling', label:'造型变更'},
  {key:'engineering', label:'工程变更'}, {key:'commercial', label:'商务变更'}, {key:'other', label:'其他变更'}
];

function reviewDomainFor(row, attributes, domains) {
  const label=reviewDomainLabel(attributes);
  return {index:domains.findIndex(domain => domain.label === label),unclassified:label === '未分类'};
}

function reviewTargetRows(summary, attributesFor){
 const rows=summary.parts.filter(row=>!row.forecastOnly&&!row.targetPackage).map(row=>({...row,attributes:attributesFor(row)}));
 const partMap=new Map(summary.parts.map(row=>[row.partNumber,row]));
 for(const budget of summary.packages || []){
  const labels=new Set(budget.partNumbers.map(number=>reviewDomainLabel(attributesFor(partMap.get(number)))));
  rows.push({quantity:1,targetAmount:budget.amount,attributes:{category2:labels.size===1?labels.values().next().value:''},sharedDomains:labels.size>1?[...labels,'未分类']:[]});
 }
 return rows;
}
function reviewBreakdown(rows, amountField, attributesFor, domains) {
  const values = domains.map(() => 0);
  const missingByDomain = domains.map(() => 0);
  const countByDomain = domains.map(() => 0);
  let count = 0, missing = 0, unclassified = 0, known = 0;
  for (const row of rows || []) {
    const quantity = Number(row.quantity);
    if (!Number.isFinite(quantity) || quantity === 0) continue;
    count++;
    const domain = reviewDomainFor(row, attributesFor(row),domains);
    countByDomain[domain.index]++;
    if (domain.unclassified) unclassified++;
    const amount = row[amountField];
    if (amount == null || !Number.isFinite(Number(amount))) { missing++; missingByDomain[domain.index]++; }
    const knownAmount=amountField==='currentAmount' ? row.knownCurrentAmount ?? amount : amount;
    if(knownAmount==null || !Number.isFinite(Number(knownAmount)))continue;
    known++;
    values[domain.index] += Number(knownAmount);
  }
  const total = count && !missing ? values.reduce((sum,value) => sum + value, 0) : null;
  return {values,total,knownTotal:known?values.reduce((sum,value)=>sum+value,0):null,count,missing,unclassified,missingByDomain,countByDomain,negative:values.some(value => value < 0)};
}

function reviewPreviousSnapshot(project, variantId, weekStart) {
  const start = new Date(weekStart);
  start.setDate(start.getDate() - 7);
  return (project.freezes || []).filter(snapshot => {
    const time = new Date(snapshot.createdAt).getTime();
    return snapshot.variantId === variantId && Number.isFinite(time) && time >= start.getTime() && time < weekStart.getTime();
  }).sort((a,b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime())[0] || null;
}

function reviewBridge(project, variantId, snapshot, previous, current, week, currentRows) {
  const amounts = Object.fromEntries(REVIEW_CHANGE_KINDS.map(kind => [kind.key,0]));
  const weeklyAmounts = Object.fromEntries(REVIEW_CHANGE_KINDS.map(kind => [kind.key,0]));
  if (!snapshot || previous.total == null) return {available:false, amounts, residual:null, reason:'缺少完整的上周锁板'};
  const lockTime = new Date(snapshot.createdAt).getTime();
  const rows = new Map((snapshot.rows || []).map(row => [row.partNumber,row]));
  const entries = (project.prices || []).map((record,index) => ({record,index,time:record.recordedAt ? new Date(record.recordedAt).getTime() : NaN}));
  if (entries.some(entry => !Number.isFinite(entry.time))) return {available:false,amounts,residual:null,reason:'历史价格缺少记录时间'};
  const history = entries.filter(entry => entry.time <= lockTime).map(entry => entry.record);
  const historicalProject = {prices:history};
  for (const row of rows.values()) {
    if (!Number(row.quantity) || !row.current) continue;
    const selected = selectEffectivePrice(historicalProject,row.partNumber,variantId);
    if (!selected || (selected.recordId && row.current.recordId && selected.recordId !== row.current.recordId) || Number(selected.amount) !== Number(row.current.amount)) {
      return {available:false,amounts,residual:null,reason:'锁板与历史价格无法对应'};
    }
  }
  const changes = new Map((project.changes || []).map(change => [change.changeId,change]));
  const currentQuantities = new Map((currentRows || []).map(row => [row.partNumber,Number(row.quantity) || 0]));
  const subsequent = entries.filter(entry => entry.time > lockTime).sort((a,b) => a.time - b.time || a.index - b.index);
  let incomplete = 0, weeklyNewParts = 0;
  for (const entry of subsequent) {
    const record = entry.record;
    const change = record.changeId ? changes.get(record.changeId) : null;
    const sourceRow = rows.get(record.partNumber);
    const quantity = sourceRow ? Number(sourceRow.quantity) : 0;
    const inWeek = week && entry.time >= week.start.getTime() && entry.time < week.end.getTime();
    if (inWeek && change && changePriceIsIncluded(change) && (record.variantId == null || record.variantId === variantId) && !quantity && currentQuantities.get(record.partNumber)) weeklyNewParts++;
    const isTracked = change && changePriceIsIncluded(change) && Object.prototype.hasOwnProperty.call(amounts,change.category) && quantity;
    const before = isTracked ? selectEffectivePrice(historicalProject,record.partNumber,variantId) : null;
    history.push(record);
    if (!isTracked) continue;
    const after = selectEffectivePrice(historicalProject,record.partNumber,variantId);
    if (!before || !after || !Number.isFinite(Number(before.amount)) || !Number.isFinite(Number(after.amount))) { incomplete++; continue; }
    const effect = (Number(after.amount) - Number(before.amount)) * quantity;
    amounts[change.category] += effect;
    if (inWeek) weeklyAmounts[change.category] += effect;
  }
  if (incomplete) return {available:false,amounts,residual:null,reason:'部分变更缺少变更前或变更后的有效价格'};
  const sum = REVIEW_CHANGE_KINDS.reduce((total,kind) => total + amounts[kind.key],0);
  const weeklySum = REVIEW_CHANGE_KINDS.reduce((total,kind) => total + weeklyAmounts[kind.key],0);
  const residual = current.total == null ? null : current.total - previous.total - sum;
  return {available:true,amounts,sum,weeklyAmounts,weeklySum,weeklyComplete:weeklyNewParts === 0,weeklyReason:weeklyNewParts ? '本周新增装车零件，缺少可归因的上周用量基线' : null,residual,reason:null};
}

function reviewPeriod(project, date, currentDate=project.reviewCurrentDate || '') {
  const fallback=new Date();fallback.setDate(fallback.getDate()-7);
  const baselineDate=bomVersionDate(date || project.reviewBaselineDate || dateInputValue(fallback));
  currentDate=currentDate ? bomVersionDate(currentDate) : '';
  if(currentDate && currentDate<baselineDate)throw new Error('current stage 日期不能早于 last stage。');
  const cutoff=new Date(baselineDate+'T23:59:59.999');
  const historicalCurrent=!!currentDate && currentDate<dateInputValue();
  const end=historicalCurrent ? new Date(new Date(currentDate+'T23:59:59.999').getTime()+1) : new Date(Date.now()+1);
  return {baselineDate,currentDate,historicalCurrent,cutoff,start:new Date(cutoff.getTime()+1),end};
}
function currentStageProject(project, period=reviewPeriod(project)) {
  if(!period.historicalCurrent || project._reviewStageAt===period.end.getTime())return project;
  const stage=historicalProject(project,new Date(period.end.getTime()-1));
  // Business dates govern backfilled changes, just as version dates govern imported BOMs.
  stage.project.changes=(project.changes || []).filter(change=>String(change.date || '').slice(0,10)<=period.currentDate);
  stage.project._reviewStageAt=period.end.getTime();
  return stage.project;
}
function historicalProject(project, cutoff) {
  const historical=bomProjectAt(project,cutoff.getTime()), limit=cutoff.getTime();
  historical.attributes=safeDictionary(project.attributes);
  const before=value=>value!=null && Number.isFinite(new Date(value).getTime()) && new Date(value).getTime()<=limit;
  const structure=latestBomRecord(historical.imports,limit);
  const cost=latestBomRecord(historical.costImports,limit);
  if(cost?.attributesSnapshot)historical.attributes=clone(cost.attributesSnapshot);
  let reliable=true;
  if(structure)historical.occurrences=getOccurrences(historical);
  else if(cost?.structureSnapshot)historical.occurrences=clone(cost.structureSnapshot);
  else if((project.imports || []).length || (project.costImports || []).length || !before(project.createdAt)) { historical.occurrences=[];reliable=false; }
  const events=(appState?.auditEvents || []).filter(event=>event.projectId===project.id && new Date(event.occurredAt).getTime()>limit).slice().sort((a,b)=>new Date(b.occurredAt)-new Date(a.occurredAt));
  for(const event of events){
    if(event.entityType==='costChange'){
      const id=event.entityId;historical.changes=historical.changes.filter(change=>change.changeId!==id);
      if(event.before)historical.changes.push(clone(event.before.change || event.before));
    }
    if(event.entityType==='bomOccurrence' && event.action==='create')historical.occurrences=historical.occurrences.filter(row=>row.occurrenceId!==event.entityId);
    if(event.entityType==='partAttributes' && event.before)historical.attributes[event.entityId]=clone(event.before);
  }
  historical.changes=(historical.changes || []).filter(change=>before(change.date) && (!change.createdAt || before(change.createdAt)));
  historical.costChangeLinks=(project.costChangeLinks || []).filter(link=>before(link.createdAt || link.linkedAt));
  return {project:historical,reliable};
}
function periodChanges(project, period) {
  return (project.changes || []).filter(change=>{if(change.deletedAt)return false;const time=parseLocalDate(change.date);if(/^\d{4}-\d{2}-\d{2}$/.test(change.date))time.setHours(0,0,0,0);return time>=period.start && time<period.end;});
}
function reviewData(project, variantId, weekStart, cachedSummary) {
  const period=reviewPeriod(project,weekStart ? dateInputValue(weekStart) : undefined);
  project=currentStageProject(project,period);
  const summary = cachedSummary && cachedSummary.forecastEffects ? cachedSummary : dashboardForecast(project,variantId);
  const historical=historicalProject(project,period.cutoff);
  historical.project.changes=(project.changes || []).filter(change=>String(change.date || '').slice(0,10)<=period.baselineDate);
  const prior=dashboardForecast(historical.project,variantId);
  const currentNumbers=new Set(aggregateBom(project).map(row=>row.partNumber));
  const priorNumbers=new Set(aggregateBom(historical.project).map(row=>row.partNumber));
  const chartAttrs=(row,owner,numbers)=>{const number=row.forecastOnly ? row.sourcePartNumber : row.partNumber;return number && numbers.has(number) ? partAttributes(owner,number) : row.attributes || partAttributes(owner,number);};
  const attrs = row => chartAttrs(row,project,currentNumbers);
  const previousAttrs = row => {const number=row.forecastOnly ? row.sourcePartNumber : row.partNumber;return number && currentNumbers.has(number) ? partAttributes(project,number) : chartAttrs(row,historical.project,priorNumbers);};
  const snapshot = reviewPreviousSnapshot(project,variantId,period.start);
  const targetRows=reviewTargetRows(summary,attrs);
  const domains = reviewChartDomains(project,(snapshot?.rows || []).map(row=>({...row,attributes:previousAttrs(row)})).concat(prior.parts.map(row=>({...row,attributes:previousAttrs(row)}))).concat(summary.parts.map(row=>({...row,attributes:attrs(row)}))).concat(targetRows));
  const target = reviewBreakdown(targetRows,'targetAmount',row=>row.attributes,domains);
  const current = reviewBreakdown(summary.parts,'currentAmount',attrs,domains);
  const previous=reviewBreakdown(prior.parts,'currentAmount',previousAttrs,domains);
  previous.total=historical.reliable ? prior.current : null;
  if(!historical.reliable)previous.knownTotal=null;
  const amounts=Object.fromEntries(REVIEW_CHANGE_KINDS.map(kind=>[kind.key,0]));
  const changes=periodChanges(project,period);
  const attributable=dashboardForecast({...project,changes:changes.map(change=>({...change,costBomEntry:false}))},variantId);
  const incompleteCategories=new Set(),knownCategories=new Set();
  for(const effect of attributable.forecastEffects){
    if(!(effect.category in amounts))continue;
    if(effect.delta==null)incompleteCategories.add(effect.category);
    else {amounts[effect.category]+=effect.delta;knownCategories.add(effect.category);}
  }
  const knownChanges=Object.fromEntries(Object.entries(amounts).map(([key,value])=>[key,incompleteCategories.has(key)&&!knownCategories.has(key)?null:value]));
  const sum=Object.values(amounts).reduce((a,b)=>a+b,0);
  const available=previous.total!=null && summary.current!=null && !attributable.forecastIssues.length;
  const bridge={available,amounts,knownChanges,sum,residual:available?summary.current-previous.total-sum:null,reason:available?null:'所选日期的历史成本或期间变更价差资料不足，无法还原'};
  current.forecastIssues=summary.forecastIssues;
  current.total=summary.current;
  if(summary.parts.length&&!summary.parts.some(row=>row.quantity))target.total=summary.target;
  return {target,current,snapshot,previous,bridge,domains,forecast:summary,period};
}

function reviewChartSvg(data) {
  const W=850, H=258, top=25, bottom=204, left=48, right=824;
  const extra=data.bridge.residual!=null && Math.abs(data.bridge.residual)>.01;
  const kinds=extra ? REVIEW_CHANGE_KINDS.concat([{key:'residual',label:'其他差异'}]) : REVIEW_CHANGE_KINDS;
  const amounts={...(data.bridge.available ? data.bridge.amounts : data.bridge.knownChanges || data.bridge.amounts),residual:data.bridge.residual};
  const x=[100,225,...kinds.map((kind,i)=>310+i*370/Math.max(1,kinds.length-1)),790];
  const mainWidth=64, changeWidth=51;
  const totals=[data.target,data.previous,data.current].map(item=>item.total ?? item.knownTotal).filter(value => value != null && Number.isFinite(value));
  const levels=[];
  let running=data.previous.total ?? data.previous.knownTotal;
  if (running != null) {
    levels.push(running);
    for (const kind of kinds) { running += amounts[kind.key] ?? 0; levels.push(running); }
  }
  const all=totals.concat(levels).filter(value => Number.isFinite(value));
  const high=Math.max(1,...all), low=Math.min(0,...all);
  const positives=totals.filter(value => value > 0);
  const smallest=positives.length ? Math.min(...positives) : 0;
  const useBreak=low === 0 && positives.length >= 2 && smallest > high * .72 && high > 0;
  const cut=useBreak ? Math.max(0,smallest - Math.max(high*.04,(high-smallest)*.4)) : 0;
  const ceiling=high + Math.max(high*.08,1);
  const floor=low < 0 ? low - Math.max(Math.abs(low)*.08,1) : 0;
  const lowerPixels=32;
  function y(value) {
    if (useBreak && cut > 0) {
      if (value <= cut) return bottom - Math.max(0,value) / cut * lowerPixels;
      return bottom - lowerPixels - (value-cut) / (ceiling-cut) * (bottom-top-lowerPixels);
    }
    return bottom - (value-floor)/(ceiling-floor)*(bottom-top);
  }
  const fmt=value => value == null ? '—' : money(Math.abs(value) < .005 ? 0 : value);
  const signed=value => value == null ? '—' : (value > .005 ? '+' : '') + fmt(value);
  let svg='<svg class="review-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="目标成本、成本基线和本周成本，以及各类成本变更瀑布图">';
  svg+='<line x1="'+left+'" y1="'+y(0)+'" x2="'+right+'" y2="'+y(0)+'" stroke="#dce6e5"/>';
  for (let i=1;i<=3;i++) {
    const lineY=top+(bottom-top)*i/4;
    svg+='<line x1="'+left+'" y1="'+lineY+'" x2="'+right+'" y2="'+lineY+'" stroke="#edf2f1" stroke-dasharray="3 4"/>';
  }
  svg+='<text x="'+(left-8)+'" y="'+(y(0)+4)+'" text-anchor="end" class="review-axis">0</text>';
  if (useBreak && cut > 0) {
    const cutY=y(cut);
    svg+='<g role="img" aria-label="纵轴采用断轴显示，底部区间已压缩"><title>纵轴底部区间已压缩，柱顶金额为实际成本。</title><path d="M'+(left-12)+' '+(cutY+3)+' l4 -6 m1 6 l4 -6" fill="none" stroke="#a4b4b6" stroke-width="1.2" stroke-linecap="round"/></g>';
  }
  function stack(index, breakdown, label) {
    const total=breakdown.total ?? breakdown.knownTotal;
    const center=x[index], usable=total != null && !breakdown.negative;
    if (!usable) {
      svg+='<rect x="'+(center-mainWidth/2)+'" y="'+(bottom-38)+'" width="'+mainWidth+'" height="38" rx="4" fill="#f7faf9" stroke="#d8e4e2" stroke-dasharray="4 4"/>';
      svg+='<text x="'+center+'" y="'+(bottom-45)+'" text-anchor="middle" class="review-value">—</text>';
    } else {
      let cumulative=0;
      breakdown.values.forEach((amount,i) => {
        const start=cumulative; cumulative+=amount;
        const rectY=y(cumulative), rectH=Math.max(0,y(start)-rectY);
        const share=total>0 ? amount/total*100 : 0;
        const shareLabel=share>0 && share<0.1 ? '<0.1%' : share.toFixed(1)+'%';
        svg+='<rect x="'+(center-mainWidth/2)+'" y="'+rectY+'" width="'+mainWidth+'" height="'+rectH+'" fill="'+data.domains[i].color+'" tabindex="0"><title>'+esc(label+' · '+data.domains[i].label+'：'+fmt(amount)+' · 成本占比 '+shareLabel)+'</title></rect>';
        if(amount<=0 || total<=0)return;
        if(rectH>=16) svg+='<text x="'+center+'" y="'+(rectY+rectH/2+3)+'" text-anchor="middle" class="review-stack-percent review-stack-inside">'+esc(shareLabel)+'</text>';
      });
      svg+='<text x="'+center+'" y="'+Math.max(15,y(total)-7)+'" text-anchor="middle" class="review-value">'+esc(fmt(total)+(breakdown.total==null?'（已知）':''))+'</text>';
    }
    svg+='<text x="'+center+'" y="233" text-anchor="middle" class="review-label strong">'+esc(label)+'</text>';
  }
  stack(0,data.target,'目标成本');
  stack(1,data.previous,'last stage');
  stack(x.length-1,data.current,'current stage');
  if (levels.length === kinds.length+1) {
    let previousRight=x[1]+mainWidth/2;
    kinds.forEach((kind,i) => {
      const center=x[i+2], from=levels[i], to=levels[i+1], amount=amounts[kind.key];
      const yFrom=y(from), yTo=y(to), barY=Math.min(yFrom,yTo), barH=Math.max(2,Math.abs(yFrom-yTo));
      svg+='<line x1="'+previousRight+'" y1="'+yFrom+'" x2="'+(center-changeWidth/2)+'" y2="'+yFrom+'" stroke="#aebfbe" stroke-dasharray="4 3"/>';
      if(amount!=null)svg+='<rect x="'+(center-changeWidth/2)+'" y="'+barY+'" width="'+changeWidth+'" height="'+barH+'" rx="1" fill="'+(amount > .005 ? '#c95d53' : amount < -.005 ? '#359b71' : '#aebfbe')+'"><title>'+esc(kind.label+'：'+signed(amount))+'</title></rect>';
      svg+='<text x="'+center+'" y="'+Math.max(14,barY-5)+'" text-anchor="middle" class="review-bridge-value" fill="'+(amount > .005 ? '#b64d45' : amount < -.005 ? '#25815b' : '#788c8a')+'">'+esc(signed(amount))+'</text>';
      previousRight=center+changeWidth/2;
    });
    if(data.bridge.available)svg+='<line x1="'+previousRight+'" y1="'+y(levels[levels.length-1])+'" x2="'+(x[x.length-1]-mainWidth/2)+'" y2="'+y(levels[levels.length-1])+'" stroke="#aebfbe" stroke-dasharray="4 3"/>';
    if (data.current.total != null && data.bridge.residual != null && Math.abs(data.bridge.residual) > .01) {
      svg+='<line x1="'+(x[x.length-1]-mainWidth/2)+'" y1="'+y(levels[levels.length-1])+'" x2="'+(x[x.length-1]-mainWidth/2)+'" y2="'+y(data.current.total)+'" stroke="#d0a449" stroke-width="2" stroke-dasharray="3 3"><title>未归因差额：'+esc(signed(data.bridge.residual))+'</title></line>';
    }
  } else {
    for (let i=0;i<kinds.length;i++) svg+='<text x="'+x[i+2]+'" y="'+(bottom-45)+'" text-anchor="middle" class="review-value muted">'+esc(signed((data.bridge.knownChanges || amounts)[kinds[i].key]))+'</text>';
  }
  kinds.forEach((kind,i) => { svg+='<text x="'+x[i+2]+'" y="233" text-anchor="middle" class="review-label">'+esc(kind.label)+'</text>'; });
  return svg+'</svg>';
}

function renderVariantDomainTable(project, variantId, summary=summarizeVariant(project,variantId)) {
  const attrs=row=>partAttributes(project,row.partNumber);
  const targetRows=reviewTargetRows(summary,attrs);
  const domains=reviewDomains(project,targetRows);
  const current=reviewBreakdown(summary.parts,'currentAmount',attrs,domains);
  const target=reviewBreakdown(targetRows,'targetAmount',row=>row.attributes,domains);
  const deltaByDomain=new Map();
  for(const row of summary.parts){
    if(!row.quantity || row.delta.amount==null)continue;
    const domain=reviewDomainLabel(attrs(row));
    deltaByDomain.set(domain,(deltaByDomain.get(domain) ?? 0)+row.delta.amount);
  }
  const sharedDomains=new Set(targetRows.flatMap(row=>row.sharedDomains || []));
  const entries = domains.map((domain,index) => {
    const currentValue = current.missingByDomain[index]===current.countByDomain[index] && current.missingByDomain[index] || (!current.count && summary.current==null) ? null : current.values[index];
    const targetValue = !target.count || target.missingByDomain[index] || sharedDomains.has(domain.label) ? null : target.values[index];
    return {domain,currentValue,partial:currentValue!=null&&current.missingByDomain[index]>0,gap:current.missingByDomain[index]?null:calculateDifference(currentValue,targetValue).amount,delta:deltaByDomain.get(domain.label) ?? null};
  }).sort((a,b)=>(Math.abs(b.delta ?? 0)-Math.abs(a.delta ?? 0)) ||
    (Number(a.delta==null)-Number(b.delta==null)));
  const rows = entries.map(({domain,currentValue,partial,gap,delta})=>{
    const tone = amount => amount > 0 ? 'bad' : amount < 0 ? 'good' : '';
    return '<tr><th scope="row"><span class="domain-dot" style="background:'+domain.color+'"></span>'+esc(domain.label)+'</th><td>'+esc(money(currentValue)+(partial?'（已知）':''))+'</td><td class="'+tone(gap)+'">'+esc(money(gap))+'</td><td class="'+tone(delta)+'">'+esc(money(delta))+'</td></tr>';

function sortReviewLegend(project, domains) {
  const groups=new Map();
  function collect(attrs) {
    const second=reviewDomainLabel(attrs),first=String(attrs?.category1 || '').trim();
    if(first && !groups.has(second))groups.set(second,first);
  }
  for(const row of aggregateBom(project))collect(partAttributes(project,row.partNumber));
  for(const change of project.changes || [])if(!change.deletedAt)for(const item of change.items || [])collect(changeItemAttributes(project,item));
  return domains.map((domain,index)=>({domain,index,group:groups.get(domain.label) || '',other:domain.label.includes('及其他')})).sort((a,b)=>{
    if(a.other!==b.other)return a.other?1:-1;
    if(!a.group!==!b.group)return a.group?-1:1;
    return a.group.localeCompare(b.group,'zh-CN') || a.index-b.index;
  }).map(item=>item.domain);
}

function renderCostReview(project, variant, week, cachedData) {
  const data=cachedData || reviewData(project,variant.id,week.cutoff || week.start);
  const issues=(data.current.forecastIssues || []).slice();
  if (!data.current.count) issues.push('先导入 EBOM 并录入价格。');
  else {
    if (data.target.missing) issues.push('目标成本（单件）缺失 '+data.target.missing+' 项。');
    if (data.current.missing) issues.push('当前价格（单件）缺失 '+data.current.missing+' 项。');
  }
  if (!data.bridge.available) issues.push('各类变更展示已知金额；缺价或变更资料不完整时，变更桥与 current stage 暂不连线。标注“已知”的成本柱为已知成本小计。');
  if (data.current.unclassified) issues.push(data.current.unclassified+' 个零件尚未填写二级分类，单独列为“未分类”。');

  if (data.target.negative || data.previous.negative || data.current.negative) issues.push('存在负域成本，暂不绘制对应堆叠柱。');
  if (data.bridge.residual != null && Math.abs(data.bridge.residual) > .01) issues.push('未归因差额 '+money(data.bridge.residual)+'；请核对 EBOM 用量和单独调价。');
  const legend=sortReviewLegend(project,data.domains).map(domain => '<span><i style="background:'+domain.color+'"></i>'+esc(domain.label)+'</span>').join('');
  const options=project.variants.map(item => '<button type="button" class="review-switch-btn'+(item.id === variant.id ? ' active' : '')+'" data-action="review-variant" data-variant="'+esc(item.id)+'" aria-pressed="'+(item.id === variant.id ? 'true' : 'false')+'">'+esc(item.name)+'</button>').join('');

}


function riskPriorityAmount(project,risk) {
  const values=project.variants.filter(variant=>(risk.variantIds || []).includes(variant.id)).map(variant=>riskVariantAmount(risk,variant.id)).filter(value=>value!=null && Number.isFinite(value));
  if(values.length)return Math.max(...values);

  if (bytes.length >= 8 && [137,80,78,71,13,10,26,10].every((value,index) => bytes[index] === value)) mime = 'image/png';
  else if (bytes.length >= 3 && bytes[0] === 255 && bytes[1] === 216 && bytes[2] === 255) mime = 'image/jpeg';
  else if (bytes.length >= 12 && String.fromCharCode(...bytes.slice(0,4)) === 'RIFF' && String.fromCharCode(...bytes.slice(8,12)) === 'WEBP') mime = 'image/webp';
  if (!mime) throw new Error('会议纪要截图请选择 PNG、JPEG 或 WebP 图片。');
  return {name:String(file.name || '会议纪要截图').slice(0,180),mime,size:bytes.length,sha256:await sha256Hex(bytes),dataUrl:'data:'+mime+';base64,'+b64(bytes)};
}

function buildChangeRecord(project, formData, existing, screenshot, now) {
  const category = String(formData.get('category') || '');
  const requestedNumber=String(formData.get('changeNumber') || '').trim();
  const changeNumber=existing?changeNumberOf(existing):requestedNumber || nextChangeNumber();
  if(existing && requestedNumber && requestedNumber!==changeNumber)throw new Error('变更号为唯一追溯凭证，保存后不能修改');
  if(!changeNumber || changeNumber.length>120 || /[\u0000-\u001f\u007f]/.test(changeNumber))throw new Error('变更号不能为空、超过120字或包含控制字符');
  if(appState.projects.some(p=>(p.changes || []).some(c=>c.changeId!==(existing&&existing.changeId)&&changeNumberOf(c).toUpperCase()===changeNumber.toUpperCase())))throw new Error('变更号已存在，请使用唯一变更号');
  const costBomChoice = String(formData.get('costBomEntry') || 'no');
  const costBomEntry = costBomChoice === 'yes';
  const costBomRemark = String(formData.get('costBomRemark') || '').trim();
  const costBomImportId = costBomEntry ? String(formData.get('costBomImportId') || '').trim() : '';
  const budgetBasis = String(formData.get('budgetBasis') || 'unit');
  const date = String(formData.get('date') || '').trim();
  const reason = String(formData.get('reason') || '').trim();
  const {name:meetingName,date:meetingDate} = decisionMeetingFromForm(formData);
  if (!REVIEW_CHANGE_KINDS.some(kind=>kind.key===category)) throw new Error('请选择变更类别。');
  if (!['yes','no'].includes(costBomChoice)) throw new Error('请选择是否已进入 Cost BOM。');
  if (!['unit','vehicleDelta'].includes(budgetBasis)) throw new Error('请选择决策预算口径。');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw new Error('请填写有效的变更日期。');
  bomVersionDate(date);
  const manualDate=String(formData.get('costBomManualDate') || '').trim();
  const entryBaseline = resolveChangeBomBaseline(project,costBomEntry,costBomImportId,date,manualDate,existing?.costBomImportId==='@manual' ? existing.costBomEntryDate : '');
  const costBomEntryDate = entryBaseline ? entryBaseline.date : '';
  if (meetingDate && !/^\d{4}-\d{2}-\d{2}$/.test(meetingDate)) throw new Error('请填写有效的会议日期。');
  if (!reason) throw new Error('请填写变更描述。');
  const validVariants = new Set(project.variants.map(variant => variant.id));
  const variantIds = Array.from(new Set(formData.getAll('variantIds').map(value => String(value))));
  if (!variantIds.length || variantIds.some(id => !validVariants.has(id))) throw new Error('请至少勾选一个涉及的车型配置。');
  const itemIds = Array.from(new Set(formData.getAll('itemIds').map(value => String(value))));
  if (!itemIds.length || itemIds.some(id => !/^[A-Za-z0-9_-]{1,120}$/.test(id))) throw new Error('请至少填写一个涉及零件。');
  const items = [], seenNumbers = new Set(), coveredVariants = new Set();
  for (const itemId of itemIds) {
    const partNumber = String(formData.get('partNumber:'+itemId) || '').trim();
    const match = changePartMatch(project,partNumber);
    const enteredName = String(formData.get('partName:'+itemId) || '').trim();
    const name = enteredName || (match.row ? partName(partNumber,match.row) : '');
    if (!name) throw new Error('请填写零件名称；已匹配零件号可自动带出名称。');
    if (partNumber && seenNumbers.has(partNumber)) throw new Error('同一变更单中零件号不能重复，请合并为一项。');
    if (partNumber) seenNumbers.add(partNumber);
    const variantPrices = Object.create(null);
    for (const variantId of variantIds) {
      if (!formData.has('applies:'+itemId+':'+variantId)) continue;
      coveredVariants.add(variantId);
      const rawBudget = String(formData.get('budget:'+itemId+':'+variantId) || '').trim();
      const rawFinal = String(formData.get('finalPrice:'+itemId+':'+variantId) || '').trim();
      const budget = numberValue(rawBudget), finalPrice = numberValue(rawFinal);
      if ((rawBudget && budget == null) || (rawFinal && finalPrice == null)) throw new Error('预算与落地价格请输入有效数字。');

      const rawQuantity=budgetBasis==='unit' ? String(formData.get('quantity:'+itemId+':'+variantId) || '').trim() : '';
      const quantity=numberValue(rawQuantity);
      if (rawQuantity && (quantity==null || quantity<0)) throw new Error('装车用量不能为负数。');
      variantPrices[variantId] = {budget,finalPrice,quantity};
    }
    if (!Object.keys(variantPrices).length) throw new Error('每个零件至少选择一个涉及的配置。');
    const priorItem=existing?.items?.find(item=>item.itemId===itemId);
    const domainDefaults=changeItemAttributes(project,{...(priorItem || {}),partNumber});
    const category1=formData.has('category1:'+itemId)?String(formData.get('category1:'+itemId) || '').trim():domainDefaults.category1;
    const category2=match.row ? String(partAttributes(project,partNumber).category2 || '').trim() : formData.has('category2:'+itemId)?String(formData.get('category2:'+itemId) || '').trim():domainDefaults.category2;
    items.push({itemId,partName:name,partNumber,category1,category2,deltaBasis:budgetBasis,variantPrices,matchedEbomImportId:match.inEbom && match.latest ? match.latest.importId : null});
  }
  if (variantIds.some(id => !coveredVariants.has(id))) throw new Error('每个勾选的车型配置至少需要一个涉及零件。');
  const meetingComplete = !!(meetingName && meetingDate);
  const manualStatus = formData.has('manualStatus') ? String(formData.get('manualStatus') || '') : String(existing?.manualStatus || '');
  if (manualStatus && !['pending','negotiating','landed'].includes(manualStatus)) throw new Error('请选择有效的状态。');
  const workflowStatus = manualStatus || deriveChangeStatus({name:meetingName,date:meetingDate},items);
  const today = dateInputValue(new Date(now));
  const previousStatus = existing ? changeProgress(project,existing) : null;
  const statusDate = existing && existing.statusDate && previousStatus === workflowStatus ? existing.statusDate : today;
  const approval = existing && Object.prototype.hasOwnProperty.call(existing,'approval') ? existing.approval : null;
  const changeId = existing ? existing.changeId : newId();
  const latest = currentImport(project);
  const oldMeeting = existing && existing.meeting || {};
  const oldScreenshot = oldMeeting.screenshot || null;
  const screenshotHistory = Array.isArray(oldMeeting.screenshotHistory) ? oldMeeting.screenshotHistory.slice() : [];
  const screenshotChanged = !!(oldScreenshot && screenshot && (oldScreenshot.sha256 !== screenshot.sha256 || oldScreenshot.name !== screenshot.name));
  if (screenshotChanged) screenshotHistory.push({...oldScreenshot,supersededAt:now});
  const currentScreenshot = screenshot ? {...screenshot,recordedAt:screenshotChanged || !oldScreenshot ? now : screenshot.recordedAt || now} : null;
  const change = {
    ...(existing || {}),changeId,changeNumber,projectId:project.id,category,approval,workflowStatus,manualStatus:manualStatus || null,date,statusDate,reason,variantIds,budgetBasis,priceMeaning:"delta",items,costBomEntry,costBomImportId,costBomEntryDate,costBomRemark,
    meeting:{name:meetingName,date:meetingDate,screenshot:currentScreenshot,screenshotHistory},
    meetingReference:[meetingName,meetingDate].filter(Boolean).join(' · '),
    ebomImportId:existing ? existing.ebomImportId || null : latest ? latest.importId : null,
    latestMatchedEbomImportId:latest ? latest.importId : null,
    createdAt:existing ? existing.createdAt : now,updatedAt:now,
    statusHistory:(existing && existing.statusHistory || []).concat([{workflowStatus,manualStatus:manualStatus || null,costBomEntry,date:statusDate,recordedAt:now}])
  };
  const priceRecords=[];
  const unmatched=items.filter(item=>!item.partNumber || !changePartMatch(project,item.partNumber).row).length;
  const pendingPairs=0;
  return {change,priceRecords,unmatched,pendingPairs};
}

function decisionMeetingFromForm(formData) {
  if (!formData.has('decisionMeeting')) return {name:String(formData.get('meetingName') || '').trim(),date:String(formData.get('meetingDate') || '').trim()};
  const text=String(formData.get('decisionMeeting') || '').trim();
  const match=text.match(/\b(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})\b/);
  if (!match) return {name:text,date:''};
  const date=match[1]+'-'+match[2].padStart(2,'0')+'-'+match[3].padStart(2,'0');
  const parsed=new Date(date+'T00:00:00');
  const valid=Number.isFinite(parsed.getTime()) && dateInputValue(parsed)===date;
  return {name:text.replace(match[0],'').replace(/^[\s·]+|[\s·]+$/g,''),date:valid?date:'invalid'};
}

function changeDraftStatus(formData) {
  const variantIds = formData.getAll('variantIds').map(String);
  const itemIds = formData.getAll('itemIds').map(String);
  if (!variantIds.length || !itemIds.length) return 'pending';
  const items = [], covered = new Set();
  for (const itemId of itemIds) {
    if (!String(formData.get('partName:'+itemId) || '').trim() && !String(formData.get('partNumber:'+itemId) || '').trim()) return 'pending';
    const variantPrices = Object.create(null);
    for (const variantId of variantIds) {
      if (!formData.has('applies:'+itemId+':'+variantId)) continue;
      covered.add(variantId);
      variantPrices[variantId] = {budget:numberValue(formData.get('budget:'+itemId+':'+variantId)),finalPrice:numberValue(formData.get('finalPrice:'+itemId+':'+variantId))};
    }
    if (!Object.keys(variantPrices).length) return 'pending';
    items.push({variantPrices});
  }
  if (variantIds.some(id => !covered.has(id))) return 'pending';
  return deriveChangeStatus(decisionMeetingFromForm(formData),items);
}

async function saveChangeForm(formData) {

  const form = typeof document !== 'undefined' ? document.querySelector('#changeForm') : null;
  const submitButton = form ? form.querySelector('[data-action="submit-dialog-form"]') : null;
  const oldLabel = submitButton ? submitButton.textContent : '';
  if (submitButton) { submitButton.disabled = true; submitButton.textContent = '保存中…'; }
  try {
    const project = getActiveProject();
    const changeId = String(formData.get('changeId') || '');
    const existing = changeId ? project.changes.find(item => item.changeId === changeId) : null;
    if (changeId && !existing) throw new Error('找不到原变更记录。');
    const oldScreenshot = existing && existing.meeting && existing.meeting.screenshot;
    const screenshot = await readMeetingScreenshot(formData.get('meetingScreenshot'),oldScreenshot);
    const result = buildChangeRecord(project,formData,existing,screenshot,nowIso());
    const before = existing ? changeAuditCopy(existing) : null;

    await commitMutation({projectId:project.id,entityType:'costChange',entityId:result.change.changeId,action:existing ? 'update' : 'create',partNumbers:result.change.items.map(item => item.partNumber).filter(Boolean),before,after,note:'保存状态、配置价格与会议记录'},() => {

    });
    closeDialog(); render();

  finally {

    if (submitButton) { submitButton.disabled = false; submitButton.textContent = oldLabel; }
  }
}

function changeVariance(project,change,variantId,parts) {
  const relevant=(change.items || []).map(item=>({item,price:changeVariantPrice(item,variantId)})).filter(({price})=>price && !changeBlankIsNoImpact(change,price));
  if(!relevant.length)return {text:'—',overLimit:false};
  if(relevant.some(({price})=>price.finalPrice==null))return {text:'待谈价',overLimit:false};
  if(relevant.some(({price})=>price.budget==null || !Number.isFinite(Number(price.budget))))return {text:'无法计算',reason:'缺少决策预算',overLimit:false};
  const budgetChange={...change,items:relevant.map(({item,price})=>({...item,variantPrices:{[variantId]:{...price,finalPrice:price.budget}}}))};
  const budget=changeSummaryAmount(project,variantId,[budgetChange],parts);
  const actual=changeSummaryAmount(project,variantId,[change],parts);
  if(budget==null || actual==null)return {text:'无法计算',reason:'缺少有效价格或装车用量',overLimit:false};
  if(budget===0)return actual===0?{text:'—',overLimit:false}:{text:'无法计算',reason:'决策预算为零',overLimit:false};
  const rate=(actual-budget)/Math.abs(budget);
  return rate>0?{text:rate*100<0.5?'＜1%':(rate*100).toFixed(0)+'%',rate,overLimit:rate>0.1}:{text:'—',overLimit:false};
}

function changeVarianceSummary(project,change,parts) {
  const ids=changeVariantIds(project,change);
  const results=project.variants.filter(variant=>ids.includes(variant.id)).map(variant=>({variant,...changeVariance(project,change,variant.id,parts)}));
  const title=results.map(result=>result.variant.name+'：'+(result.text==='—'?'无超差':result.text)+(result.reason?'（'+result.reason+'）':'')).join('；');
  const over=results.filter(result=>result.rate>0).sort((a,b)=>b.rate-a.rate)[0];
  if(over)return {text:'超差'+over.text,tone:over.overLimit?'is-over-limit':'',title};
  if(results.some(result=>result.text==='待谈价'))return {text:'无实际价格',tone:'',title};
  if(!results.length || results.some(result=>result.text==='无法计算'))return {text:'无法计算',tone:'is-unknown',title:title || '未指定车型配置'};
  return {text:'未超预算',tone:'',title};
}

function renderChangeImpact(change,lines,progress) {
  const entries=[];
  let hasImpact=false;
  for(const {variant,price} of lines) {
    if(!price || changeBlankIsNoImpact(change,price) || (Number(price.budget)===0 && price.budget!=null && Number(price.finalPrice)===0 && price.finalPrice!=null)){entries.push('<span class="change-impact-item" aria-hidden="true"></span>');continue;}
    hasImpact=true;
    const amount=price.finalPrice!=null?price.finalPrice:price.budget;
    const detail=changePriceNote(price,progress);
    entries.push('<span class="change-impact-item"><strong>'+esc(variant.name)+'</strong><span class="change-impact-value">'+esc(riskDeltaMoney(amount))+detail+'</span></span>');
  }
  return hasImpact?'<div class="change-impact-list" style="grid-template-columns:repeat('+lines.length+',minmax(112px,1fr))">'+entries.join('')+'</div>':'';
}

function changePriceNote(price,progress) {
  if(progress==='negotiating' || progress==='decided')return '<span class="change-await-price">（待谈价）</span>';
  if(price.finalPrice==null || price.budget==null || !Number.isFinite(Number(price.finalPrice)) || !Number.isFinite(Number(price.budget)) || Number(price.budget)===0)return '';
  const rawRate=(Number(price.finalPrice)-Number(price.budget))/Math.abs(Number(price.budget));
  return rawRate>0?'<span'+(rawRate>=0.1?' class="change-over-limit"':'')+'>（超差'+esc((rawRate*100).toFixed(0))+'%）</span>':'';
}

function changeOverBudgetRate(change,price) {
  if(changeBlankIsNoImpact(change,price))return '—';
  if(price.finalPrice==null)return '待落地';
  if(price.budget==null || !Number.isFinite(Number(price.budget)) || !Number.isFinite(Number(price.finalPrice)) || Number(price.budget)===0)return '—';
  const rate=(Number(price.finalPrice)-Number(price.budget))/Math.abs(Number(price.budget));
  return (rate>0?'+':'')+pct(rate);
}

function changeSummaryAmount(project,variantId,changes,parts) {
  let total=0;
  for(const change of changes) for(const item of change.items || []) {
    const price=changeVariantPrice(item,variantId);
    if(!price || changeBlankIsNoImpact(change,price))continue;
    const raw=price.finalPrice!=null?price.finalPrice:price.budget;
    if(raw==null || !Number.isFinite(Number(raw)))return null;
    if(Number(raw)===0)continue;
    if(change.budgetBasis==='vehicleDelta'){total+=Number(raw);continue;}
    parts ??= new Map(aggregateBom(project).map(row=>[row.partNumber,row]));
    const part=parts.get(item.partNumber);
    if(part && !part.quantityByVariant[variantId] && part.fitmentByVariant)continue;
    const quantity=part?.quantityByVariant[variantId] || (price.quantity!=null ? Number(price.quantity) : null);
    if(quantity==null || !Number.isFinite(quantity) || quantity<=0)return null;
    total+=Number(raw)*quantity;
  }
  return total;
}

async function updateRiskField(riskId,field,value) {

function alignFieldContents(root=document) {
  if(!root || !root.querySelectorAll)return;

  const labels=Array.from(root.querySelectorAll('.field')).map(field=>({label:field.querySelector(':scope > label'),control:field.querySelector(':scope > input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]),:scope > select,:scope > textarea')})).filter(item=>item.label && item.control && shown(item.control));

    for(const key of ['fontFamily','fontSize','fontWeight','fontStyle','letterSpacing','wordBreak','tabSize'])mirror.style[key]=style[key];
    mirror.style.lineHeight=line+'px';mirror.style.width=Math.max(1,textarea.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight))+'px';
    mirror.textContent=(textarea.value || textarea.placeholder || '')+'\u200b';
    const contentHeight=mirror.getBoundingClientRect().height,padding=Math.max(6,(textarea.clientHeight-contentHeight)/2);
    textarea.style.paddingTop=padding+'px';textarea.style.paddingBottom=padding+'px';
    if(contentHeight+12<=textarea.clientHeight)textarea.scrollTop=0;
    if(fieldAlignmentObserver && !observedFormFields.has(textarea)){fieldAlignmentObserver.observe(textarea);observedFormFields.add(textarea);}
  }
  mirror.remove();
  for(const input of root.querySelectorAll('.field input[type="file"]')){
    if(!shown(input))continue;
    const button=getComputedStyle(input,'::file-selector-button');
    const buttonHeight=(parseFloat(button.lineHeight)||20)+(parseFloat(button.paddingTop)||0)+(parseFloat(button.paddingBottom)||0)+(parseFloat(button.borderTopWidth)||0)+(parseFloat(button.borderBottomWidth)||0);

  }

function riskProgressDate(value) {
  const date=String(value || '').trim(),parsed=new Date(date+'T00:00:00');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(parsed.getTime()) || dateInputValue(parsed)!==date)throw new Error('请填写有效的进度日期。');
  return date;
}
function buildRiskProgressUpdate(risk,formData) {
  const now=nowIso(),after=clone(risk),managed=formData.get('manageProgress')==='1';
  let edited=0,deleted=0,added=0;after.progress=after.progress || [];
  if(managed){
    if(String(formData.get('progressSnapshot'))!==JSON.stringify(risk.progress || []))throw new Error('进度已发生变化，请关闭后重新打开，再保存修改。');
    const expected=riskProgressEntries(risk).map(entry=>String(risk.progress.indexOf(entry)));
    const indexes=formData.getAll('progressEntryIndexes').map(String);
    if(indexes.length!==expected.length || new Set(indexes).size!==indexes.length || indexes.some(index=>!expected.includes(index)))throw new Error('历史进度不完整，请重新打开后修改。');
    for(const index of indexes){
      const entry=after.progress[Number(index)];
      if(formData.get('deleteProgress:'+index)==='on'){entry.deletedAt=now;entry.updatedAt=now;deleted++;continue;}
      const date=riskProgressDate(formData.get('progressDate:'+index)),text=String(formData.get('progressText:'+index) || '').trim();
      if(!text || text.length>1000)throw new Error('历史进展描述不能为空，且不能超过1000字。');
      if(date!==entry.date || text!==entry.text){entry.date=date;entry.text=text;entry.updatedAt=now;edited++;}
    }
  }
  const text=String(formData.get('progress') || '').trim();
  if(text.length>1000)throw new Error('进展描述不能超过1000字。');
  if(text){after.progress.push({progressId:newId(),date:riskProgressDate(formData.get('progressDate') || dateInputValue()),text,resolved:!!risk.resolved,recordedAt:now});added++;}
  else if(!managed)throw new Error('请填写本周进展 / 下一步。');
  const changed=!!(edited || deleted || added);
  if(changed)after.updatedAt=now;
  return {after,changed,note:'维护风险进度：新增'+added+'条，修改'+edited+'条，删除'+deleted+'条'};
}

async function verifyAuditChain() {
  let previousHash = null;
  const failures = [];
  for (let index = 0; index < appState.auditEvents.length; index++) {
    const event = appState.auditEvents[index];
    if ((event.previousHash || null) !== previousHash) failures.push(index + 1);
    const copy = clone(event);
    const recordedHash = copy.eventHash;
    delete copy.eventHash;
    const expectedHash = await sha256Hex(textEncoder.encode(canonical(copy)));
    if (recordedHash !== expectedHash) failures.push(index + 1);
    previousHash = event.eventHash;
  }
  return {ok:failures.length === 0,count:appState.auditEvents.length,failures:Array.from(new Set(failures))};
}
function thresholdRatioValue(value,label){
 const text=String(value ?? '').trim();if(!text)return null;
 const isPercent=/[%％]$/.test(text),numberText=isPercent?text.slice(0,-1).trim():text;
 if(!numberText || !/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/.test(numberText))throw new Error(label+'请输入有效的小数或百分比。');
 const amount=Number(numberText);if(!Number.isFinite(amount))throw new Error(label+'请输入有效的小数或百分比。');
 return isPercent?amount/100:amount;
}

function editTargetPackageName(button) {
  if(button.hidden || button.disabled)return;
  const project=getActiveProject();
  if(!project)return;
  const {packageKey,packageRange}=button.dataset;
  const before=project.targetPackageNames?.[packageKey] || '';
  const input=document.createElement('input');
  input.type='text';
  input.className='cost-package-name-input';
  input.setAttribute('aria-label',packageRange+' 零件包名称');
  input.maxLength=80;
  input.value=before;
  let cancelled=false;
  input.addEventListener('keydown',event=>{
    if(event.isComposing)return;
    if(event.key!=='Enter' && event.key!=='Escape')return;
    event.preventDefault();
    cancelled=event.key==='Escape';
    button.hidden=false;
    button.focus({preventScroll:true});
  });
  input.addEventListener('blur',async()=>{
    const after=cancelled?before:input.value.trim();
    input.remove();
    button.hidden=false;
    if(after===before)return;
    button.disabled=true;
    try{
      await commitMutation({
        projectId:project.id,entityType:'targetPackage',entityId:packageKey,action:'update',
        partNumbers:JSON.parse(packageKey).slice(1),before,after,note:'编辑零件包名称',refreshPage:false
      },()=>{
        project.targetPackageNames ??= {};
        if(after)project.targetPackageNames[packageKey]=after;
        else delete project.targetPackageNames[packageKey];
      });
      if(getActiveProject()===project){
        for(const cell of $$('#costPackageDetails [data-package-key]')){
          if(cell.dataset.packageKey!==packageKey)continue;
          cell.textContent=after || '双击命名';
          cell.classList.toggle('is-empty',!after);
          cell.setAttribute('aria-label',packageRange+' 零件包名称：'+(after || '未命名'));
        }
      }
    }catch(error){showToast(error.message || '无法保存零件包名称。',true);}
    finally{button.disabled=false;}
  },{once:true});
  button.hidden=true;
  button.after(input);
  input.focus({preventScroll:true});
  input.select();
}
