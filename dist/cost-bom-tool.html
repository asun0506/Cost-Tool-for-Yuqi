const $ = (selector, root) => (root || document).querySelector(selector);
const $$ = (selector, root) => Array.from((root || document).querySelectorAll(selector));
const clone = value => value == null ? value : JSON.parse(JSON.stringify(value));
const safeDictionary = value => Object.assign(Object.create(null), value || {});
const nowIso = () => new Date().toISOString();
const newId = () => {
  if (crypto.randomUUID) return crypto.randomUUID();
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  bytes[6] = (bytes[6] & 15) | 64;
  bytes[8] = (bytes[8] & 63) | 128;
  return Array.from(bytes, (b, i) => ([4, 6, 8, 10].includes(i) ? '-' : '') + b.toString(16).padStart(2, '0')).join('');
};
const textEncoder = new TextEncoder();

const parseLocalDate = value => {
  if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)) {
    const parts = value.split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2], 12, 0, 0, 0);
  }
  return new Date(value);
};
const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const asDate = value => {
  if (!value) return '—';
  const date = parseLocalDate(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleDateString('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit'});
};
const asDateTime = value => {
  if (!value) return '—';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleString('zh-CN', {hour12:false});
};
const dateInputValue = (date = new Date()) => {
  const adjusted = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
  return adjusted.toISOString().slice(0, 10);

const money = (value, currency = 'CNY') => {
  if (value == null || !Number.isFinite(Number(value))) return '—';
  const amount = Number(value);
  try { return new Intl.NumberFormat('zh-CN', {style:'currency', currency:currency || 'CNY', maximumFractionDigits:2}).format(amount); }
  catch (_) { return (currency || '') + ' ' + amount.toLocaleString('zh-CN', {maximumFractionDigits:2}); }
};
const riskDeltaMoney = value => {
  if(value==null || !Number.isFinite(Number(value)))return '—';
  const amount=Math.abs(Number(value))<.005?0:Number(value);
  return (amount<0?'-':'+')+money(Math.abs(amount));
};
const pct = value => value == null || !Number.isFinite(Number(value)) ? '—' : (Number(value) * 100).toFixed(1) + '%';

  if (value == null || String(value).trim() === '') return null;

const sha256Hex = async bytes => {
  const data = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);

function dashboardForecast(project, variantId) {

const REVIEW_CHANGE_KINDS = [

function reviewBreakdown(rows, amountField, attributesFor, domains) {

function reviewBridge(project, variantId, snapshot, previous, current, week, currentRows) {
  const amounts = Object.fromEntries(REVIEW_CHANGE_KINDS.map(kind => [kind.key,0]));
  const weeklyAmounts = Object.fromEntries(REVIEW_CHANGE_KINDS.map(kind => [kind.key,0]));
  if (!snapshot || previous.total == null) return {available:false, amounts, residual:null, reason:'缺少完整的上周锁板'};
  const lockTime = new Date(snapshot.createdAt).getTime();
  const rows = new Map((snapshot.rows || []).map(row => [row.partNumber,row]));
  const entries = (project.prices || []).map((record,index) => ({record,index,time:record.recordedAt ? new Date(record.recordedAt).getTime() : NaN}));
  if (entries.some(entry => !Number.isFinite(entry.time))) return {available:false,amounts,residual:null,reason:'历史价格缺少记录时间'};
  const history = entries.filter(entry => entry.time <= lockTime).map(entry => entry.record);
  const historicalProject = {prices:history};
  for (const row of rows.values()) {
    if (!Number(row.quantity) || !row.current) continue;
    const selected = selectEffectivePrice(historicalProject,row.partNumber,variantId);
    if (!selected || (selected.recordId && row.current.recordId && selected.recordId !== row.current.recordId) || Number(selected.amount) !== Number(row.current.amount)) {
      return {available:false,amounts,residual:null,reason:'锁板与历史价格无法对应'};
    }
  }
  const changes = new Map((project.changes || []).map(change => [change.changeId,change]));
  const currentQuantities = new Map((currentRows || []).map(row => [row.partNumber,Number(row.quantity) || 0]));
  const subsequent = entries.filter(entry => entry.time > lockTime).sort((a,b) => a.time - b.time || a.index - b.index);
  let incomplete = 0, weeklyNewParts = 0;
  for (const entry of subsequent) {
    const record = entry.record;
    const change = record.changeId ? changes.get(record.changeId) : null;
    const sourceRow = rows.get(record.partNumber);
    const quantity = sourceRow ? Number(sourceRow.quantity) : 0;
    const inWeek = week && entry.time >= week.start.getTime() && entry.time < week.end.getTime();
    if (inWeek && change && changePriceIsIncluded(change) && (record.variantId == null || record.variantId === variantId) && !quantity && currentQuantities.get(record.partNumber)) weeklyNewParts++;
    const isTracked = change && changePriceIsIncluded(change) && Object.prototype.hasOwnProperty.call(amounts,change.category) && quantity;

function reviewPeriod(project, date, currentDate=project.reviewCurrentDate || '') {

  const baselineDate=bomVersionDate(date || project.reviewBaselineDate || dateInputValue(fallback));
  currentDate=currentDate ? bomVersionDate(currentDate) : '';
  if(currentDate && currentDate<baselineDate)throw new Error('current stage 日期不能早于 last stage。');
  const cutoff=new Date(baselineDate+'T23:59:59.999');
  const historicalCurrent=!!currentDate && currentDate<dateInputValue();
  const end=historicalCurrent ? new Date(new Date(currentDate+'T23:59:59.999').getTime()+1) : new Date(Date.now()+1);
  return {baselineDate,currentDate,historicalCurrent,cutoff,start:new Date(cutoff.getTime()+1),end};
}
function currentStageProject(project, period=reviewPeriod(project)) {
  if(!period.historicalCurrent || project._reviewStageAt===period.end.getTime())return project;
  const stage=historicalProject(project,new Date(period.end.getTime()-1));
  // Business dates govern backfilled changes, just as version dates govern imported BOMs.
  stage.project.changes=(project.changes || []).filter(change=>String(change.date || '').slice(0,10)<=period.currentDate);
  stage.project._reviewStageAt=period.end.getTime();
  return stage.project;
}
function historicalProject(project, cutoff) {
  const historical=bomProjectAt(clone(project),cutoff.getTime()), limit=cutoff.getTime();
  const before=value=>value!=null && Number.isFinite(new Date(value).getTime()) && new Date(value).getTime()<=limit;
  const structure=latestBomRecord(historical.imports,limit);
  const cost=latestBomRecord(historical.costImports,limit);
  if(cost?.attributesSnapshot)historical.attributes=clone(cost.attributesSnapshot);
  let reliable=true;
  if(structure)historical.occurrences=clone(structure.snapshot || []);
  else if(cost?.structureSnapshot)historical.occurrences=clone(cost.structureSnapshot);
  else if((project.imports || []).length || (project.costImports || []).length || !before(project.createdAt)) { historical.occurrences=[];reliable=false; }
  const events=(appState?.auditEvents || []).filter(event=>event.projectId===project.id && new Date(event.occurredAt).getTime()>limit).slice().sort((a,b)=>new Date(b.occurredAt)-new Date(a.occurredAt));
  for(const event of events){
    if(event.entityType==='costChange'){
      const id=event.entityId;historical.changes=historical.changes.filter(change=>change.changeId!==id);
      if(event.before)historical.changes.push(clone(event.before.change || event.before));
    }
    if(event.entityType==='bomOccurrence' && event.action==='create')historical.occurrences=historical.occurrences.filter(row=>row.occurrenceId!==event.entityId);
    if(event.entityType==='partAttributes' && event.before)historical.attributes[event.entityId]=clone(event.before);
  }
  historical.changes=(historical.changes || []).filter(change=>before(change.date) && (!change.createdAt || before(change.createdAt)));
  historical.costChangeLinks=(project.costChangeLinks || []).filter(link=>before(link.createdAt || link.linkedAt));
  return {project:historical,reliable};
}
function periodChanges(project, period) {
  return (project.changes || []).filter(change=>{if(change.deletedAt)return false;const time=parseLocalDate(change.date);if(/^\d{4}-\d{2}-\d{2}$/.test(change.date))time.setHours(0,0,0,0);return time>=period.start && time<period.end;});
}
function reviewData(project, variantId, weekStart, cachedSummary) {
  const period=reviewPeriod(project,weekStart ? dateInputValue(weekStart) : undefined);
  project=currentStageProject(project,period);
  const summary = cachedSummary && cachedSummary.forecastEffects ? cachedSummary : dashboardForecast(project,variantId);
  const historical=historicalProject(project,period.cutoff);
  historical.project.changes=(project.changes || []).filter(change=>String(change.date || '').slice(0,10)<=period.baselineDate);
  const prior=dashboardForecast(historical.project,variantId);
  const attrs = row => row.attributes || partAttributes(project,row.partNumber);
  const snapshot = reviewPreviousSnapshot(project,variantId,period.start);
  const domains = reviewDomains(project,(snapshot?.rows || []).concat(prior.parts.map(row=>({...row,attributes:row.attributes || partAttributes(historical.project,row.partNumber)}))).concat(summary.parts.map(row=>({...row,attributes:row.attributes || partAttributes(project,row.partNumber)}))));
  const target = reviewBreakdown(summary.parts.filter(row=>!row.forecastOnly),'targetAmount',attrs,domains);
  const current = reviewBreakdown(summary.parts,'currentAmount',attrs,domains);
  const previous=reviewBreakdown(prior.parts,'currentAmount',row=>row.attributes || partAttributes(historical.project,row.partNumber),domains);
  previous.total=historical.reliable ? prior.current : null;
  const amounts=Object.fromEntries(REVIEW_CHANGE_KINDS.map(kind=>[kind.key,0]));
  const changes=periodChanges(project,period);
  const attributable=dashboardForecast({...project,changes:changes.map(change=>({...change,costBomEntry:false}))},variantId);
  for(const effect of attributable.forecastEffects)if(effect.delta!=null && effect.category in amounts)amounts[effect.category]+=effect.delta;
  const sum=Object.values(amounts).reduce((a,b)=>a+b,0);
  const available=previous.total!=null && summary.current!=null && !attributable.forecastIssues.length;
  const bridge={available,amounts,sum,residual:available?summary.current-previous.total-sum:null,reason:available?null:'所选日期的历史成本或期间变更价差资料不足，无法还原'};
  current.forecastIssues=summary.forecastIssues;
  current.total=summary.current;
  if(summary.parts.length&&!summary.parts.some(row=>row.quantity))target.total=summary.target;
  return {target,current,snapshot,previous,bridge,domains,forecast:summary,period};
}

function reviewChartSvg(data) {
  const W=850, H=258, top=25, bottom=204, left=48, right=824;
  const extra=data.bridge.residual!=null && Math.abs(data.bridge.residual)>.01;
  const kinds=extra ? REVIEW_CHANGE_KINDS.concat([{key:'residual',label:'其他差异'}]) : REVIEW_CHANGE_KINDS;
  const amounts={...data.bridge.amounts,residual:data.bridge.residual};
  const x=[100,225,...kinds.map((kind,i)=>310+i*370/Math.max(1,kinds.length-1)),790];
  const mainWidth=64, changeWidth=51;
  const totals=[data.target.total,data.previous.total,data.current.total].filter(value => value != null && Number.isFinite(value));
  const levels=[];
  let running=data.previous.total;
  if (running != null && data.bridge.available) {
    levels.push(running);
    for (const kind of kinds) { running += amounts[kind.key]; levels.push(running); }
  }
  const all=totals.concat(levels).filter(value => Number.isFinite(value));
  const high=Math.max(1,...all), low=Math.min(0,...all);
  const positives=totals.filter(value => value > 0);
  const smallest=positives.length ? Math.min(...positives) : 0;
  const useBreak=low === 0 && positives.length >= 2 && smallest > high * .72 && high > 0;
  const cut=useBreak ? Math.max(0,smallest - Math.max(high*.04,(high-smallest)*.4)) : 0;
  const ceiling=high + Math.max(high*.08,1);
  const floor=low < 0 ? low - Math.max(Math.abs(low)*.08,1) : 0;
  const lowerPixels=32;
  function y(value) {
    if (useBreak && cut > 0) {
      if (value <= cut) return bottom - Math.max(0,value) / cut * lowerPixels;
      return bottom - lowerPixels - (value-cut) / (ceiling-cut) * (bottom-top-lowerPixels);
    }
    return bottom - (value-floor)/(ceiling-floor)*(bottom-top);
  }
  const fmt=value => value == null ? '—' : money(Math.abs(value) < .005 ? 0 : value);
  const signed=value => value == null ? '—' : (value > .005 ? '+' : '') + fmt(value);
  let svg='<svg class="review-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="目标成本、成本基线和本周成本，以及各类成本变更瀑布图">';
  svg+='<line x1="'+left+'" y1="'+y(0)+'" x2="'+right+'" y2="'+y(0)+'" stroke="#dce6e5"/>';
  for (let i=1;i<=3;i++) {
    const lineY=top+(bottom-top)*i/4;
    svg+='<line x1="'+left+'" y1="'+lineY+'" x2="'+right+'" y2="'+lineY+'" stroke="#edf2f1" stroke-dasharray="3 4"/>';
  }
  svg+='<text x="'+(left-8)+'" y="'+(y(0)+4)+'" text-anchor="end" class="review-axis">0</text>';
  if (useBreak && cut > 0) {
    const cutY=y(cut);
    svg+='<g role="img" aria-label="纵轴采用断轴显示，底部区间已压缩"><title>纵轴底部区间已压缩，柱顶金额为实际成本。</title><path d="M'+(left-12)+' '+(cutY+3)+' l4 -6 m1 6 l4 -6" fill="none" stroke="#a4b4b6" stroke-width="1.2" stroke-linecap="round"/></g>';
  }
  function stack(index, breakdown, label) {
    const center=x[index], usable=breakdown.total != null && !breakdown.negative;
    if (!usable) {
      svg+='<rect x="'+(center-mainWidth/2)+'" y="'+(bottom-38)+'" width="'+mainWidth+'" height="38" rx="4" fill="#f7faf9" stroke="#d8e4e2" stroke-dasharray="4 4"/>';
      svg+='<text x="'+center+'" y="'+(bottom-45)+'" text-anchor="middle" class="review-value">—</text>';
    } else {
      let cumulative=0;
      breakdown.values.forEach((amount,i) => {
        const start=cumulative; cumulative+=amount;
        const rectY=y(cumulative), rectH=Math.max(0,y(start)-rectY);
        svg+='<rect x="'+(center-mainWidth/2)+'" y="'+rectY+'" width="'+mainWidth+'" height="'+rectH+'" fill="'+data.domains[i].color+'"><title>'+esc(label+' · '+data.domains[i].label+'：'+fmt(amount))+'</title></rect>';
      });
      svg+='<text x="'+center+'" y="'+Math.max(15,y(breakdown.total)-7)+'" text-anchor="middle" class="review-value">'+esc(fmt(breakdown.total))+'</text>';
    }
    svg+='<text x="'+center+'" y="233" text-anchor="middle" class="review-label strong">'+esc(label)+'</text>';
  }
  stack(0,data.target,'目标成本');
  stack(1,data.previous,'last stage');
  stack(x.length-1,data.current,'current stage');
  if (levels.length === kinds.length+1) {
    let previousRight=x[1]+mainWidth/2;
    kinds.forEach((kind,i) => {
      const center=x[i+2], from=levels[i], to=levels[i+1], amount=amounts[kind.key];
      const yFrom=y(from), yTo=y(to), barY=Math.min(yFrom,yTo), barH=Math.max(2,Math.abs(yFrom-yTo));
      svg+='<line x1="'+previousRight+'" y1="'+yFrom+'" x2="'+(center-changeWidth/2)+'" y2="'+yFrom+'" stroke="#aebfbe" stroke-dasharray="4 3"/>';
      svg+='<rect x="'+(center-changeWidth/2)+'" y="'+barY+'" width="'+changeWidth+'" height="'+barH+'" rx="1" fill="'+(amount > .005 ? '#c95d53' : amount < -.005 ? '#359b71' : '#aebfbe')+'"><title>'+esc(kind.label+'：'+signed(amount))+'</title></rect>';
      svg+='<text x="'+center+'" y="'+Math.max(14,barY-5)+'" text-anchor="middle" class="review-bridge-value" fill="'+(amount > .005 ? '#b64d45' : amount < -.005 ? '#25815b' : '#788c8a')+'">'+esc(signed(amount))+'</text>';
      previousRight=center+changeWidth/2;
    });
    svg+='<line x1="'+previousRight+'" y1="'+y(levels[levels.length-1])+'" x2="'+(x[x.length-1]-mainWidth/2)+'" y2="'+y(levels[levels.length-1])+'" stroke="#aebfbe" stroke-dasharray="4 3"/>';
    if (data.current.total != null && data.bridge.residual != null && Math.abs(data.bridge.residual) > .01) {
      svg+='<line x1="'+(x[x.length-1]-mainWidth/2)+'" y1="'+y(levels[levels.length-1])+'" x2="'+(x[x.length-1]-mainWidth/2)+'" y2="'+y(data.current.total)+'" stroke="#d0a449" stroke-width="2" stroke-dasharray="3 3"><title>未归因差额：'+esc(signed(data.bridge.residual))+'</title></line>';
    }
  } else {
    for (let i=0;i<kinds.length;i++) svg+='<text x="'+x[i+2]+'" y="'+(bottom-45)+'" text-anchor="middle" class="review-value muted">—</text>';
  }
  kinds.forEach((kind,i) => { svg+='<text x="'+x[i+2]+'" y="233" text-anchor="middle" class="review-label">'+esc(kind.label)+'</text>'; });
  return svg+'</svg>';
}

function renderVariantDomainTable(project, summary) {

function aggregateForDiff(rows) {

    const item = map.get(pn);
    for (const [variantId, quantity] of Object.entries(row.variantQuantities || {})) item.quantities[variantId] = (item.quantities[variantId] || 0) + Number(quantity || 0);
    if (row.name && !item.names.includes(row.name)) item.names.push(row.name);
    if (row.unit && !item.units.includes(row.unit)) item.units.push(row.unit);
    if (row.category && !item.categories.includes(row.category)) item.categories.push(row.category);

    const variantIds = new Set([...Object.keys(old.quantities), ...Object.keys(current.quantities)]);

    const oldPositions = old.sourceRows.slice().sort((a,b) => String(a).localeCompare(String(b),'zh-CN'));
    const newPositions = current.sourceRows.slice().sort((a,b) => String(a).localeCompare(String(b),'zh-CN'));
    if (canonical(oldPositions) !== canonical(newPositions)) positionsChanged.push({partNumber,before:oldPositions,after:newPositions});

const CHANGE_PROGRESS_LABELS = {pending:'未决策',decided:'推进中',negotiating:'推进中',landed:'已完成'};

function changeProgress(project, change) {
  if (typeof change.costBomEntry === 'boolean') return deriveChangeStatus(change.meeting || {},change.items || []);
  if (change.workflowStatus && CHANGE_PROGRESS_LABELS[change.workflowStatus]) return change.workflowStatus;
  const posted = (project.prices || []).some(record => record.changeId === change.changeId);
  return posted ? 'landed' : change.approval === 'pending' ? 'pending' : 'decided';
}

function changeCostBomEntry(project, change) {
  if (change && typeof change.costBomEntry === 'boolean') return change.costBomEntry;
  return !!(change && (project.prices || []).some(record => record.changeId === change.changeId));
}

function changePriceIsIncluded(change) {
  if (!change) return false;
  return typeof change.costBomEntry === 'boolean' ? change.costBomEntry : change.approval === 'approved';
}

function deriveChangeStatus(meeting, items) {
  const meetingComplete = !!(String(meeting.name || '').trim() && String(meeting.date || '').trim());
  const prices = [];
  for (const item of items || []) {
    if (item.variantPrices && typeof item.variantPrices === 'object') prices.push(...Object.values(item.variantPrices));
    else if (item.budget != null || item.finalPrice != null) prices.push({budget:item.budget,finalPrice:item.finalPrice});
  }
  const budgetsComplete = prices.length > 0 && prices.every(price => price && price.budget != null && Number.isFinite(Number(price.budget)));
  if (!meetingComplete || !budgetsComplete) return 'pending';
  return prices.every(price => price.finalPrice != null && Number.isFinite(Number(price.finalPrice))) ? 'landed' : 'negotiating';
}

function changeItemLabel(item) {
  const name = String(item.partName || '').trim();
  const number = String(item.partNumber || '').trim();
  return number ? (name ? name + ' · ' + number : number) : (name ? name + '（未编码）' : '未编码零件');

function changeVariantIds(project, change) {

    const ids = new Set(change.variantIds);
    return project.variants.filter(variant => ids.has(variant.id)).map(variant => variant.id);

async function readMeetingScreenshot(file, existing) {
  if (!file || !file.size) return existing || null;
  if (file.size > MAX_MEETING_IMAGE_BYTES) throw new Error('会议纪要截图不能超过 5 MB。');
  if (typeof file.arrayBuffer !== 'function') throw new Error('无法读取会议纪要截图。');
  const bytes = new Uint8Array(await file.arrayBuffer());
  let mime = '';
  if (bytes.length >= 8 && [137,80,78,71,13,10,26,10].every((value,index) => bytes[index] === value)) mime = 'image/png';
  else if (bytes.length >= 3 && bytes[0] === 255 && bytes[1] === 216 && bytes[2] === 255) mime = 'image/jpeg';
  else if (bytes.length >= 12 && String.fromCharCode(...bytes.slice(0,4)) === 'RIFF' && String.fromCharCode(...bytes.slice(8,12)) === 'WEBP') mime = 'image/webp';
  if (!mime) throw new Error('会议纪要截图请选择 PNG、JPEG 或 WebP 图片。');

}

function decisionMeetingFromForm(formData) {
  if (!formData.has('decisionMeeting')) return {name:String(formData.get('meetingName') || '').trim(),date:String(formData.get('meetingDate') || '').trim()};
  const text=String(formData.get('decisionMeeting') || '').trim();
  const match=text.match(/\b(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})\b/);
  if (!match) return {name:text,date:''};
  const date=match[1]+'-'+match[2].padStart(2,'0')+'-'+match[3].padStart(2,'0');
  const parsed=new Date(date+'T00:00:00');
  const valid=Number.isFinite(parsed.getTime()) && dateInputValue(parsed)===date;
  return {name:text.replace(match[0],'').replace(/^[\s·]+|[\s·]+$/g,''),date:valid?date:'invalid'};
}

function changeDraftStatus(formData) {
  const variantIds = formData.getAll('variantIds').map(String);
  const itemIds = formData.getAll('itemIds').map(String);
  if (!variantIds.length || !itemIds.length) return 'pending';
  const items = [], covered = new Set();
  for (const itemId of itemIds) {
    if (!String(formData.get('partName:'+itemId) || '').trim() && !String(formData.get('partNumber:'+itemId) || '').trim()) return 'pending';
    const variantPrices = Object.create(null);
    for (const variantId of variantIds) {
      if (!formData.has('applies:'+itemId+':'+variantId)) continue;
      covered.add(variantId);
      variantPrices[variantId] = {budget:numberValue(formData.get('budget:'+itemId+':'+variantId)),finalPrice:numberValue(formData.get('finalPrice:'+itemId+':'+variantId))};
    }
    if (!Object.keys(variantPrices).length) return 'pending';
    items.push({variantPrices});
  }
  if (variantIds.some(id => !covered.has(id))) return 'pending';
  return deriveChangeStatus(decisionMeetingFromForm(formData),items);
}

function updateChangeFormAutoStatus() {
  const form = $('#changeForm');

  if (output) output.value = CHANGE_PROGRESS_LABELS[changeDraftStatus(new FormData(form))];
}

function syncChangeVariantRows() {
  const form=$('#changeForm');if(!form)return;
  const selected=new Set(Array.from(form.querySelectorAll('[data-change-variant]:checked')).map(input=>input.value));
  const vehicle=form.elements.budgetBasis.value==='vehicleDelta';
  const hint=$('#changeNoVariants',form);if(hint)hint.classList.toggle('hidden',selected.size>0);
  for(const row of form.querySelectorAll('[data-change-variant-row]')){
    const visible=selected.has(row.dataset.variant);row.hidden=!visible;
    row.querySelector('[data-change-item-applies]').disabled=!visible;
    row.querySelectorAll('[data-change-price-field]').forEach(input=>{input.disabled=!visible;});
    row.querySelector('[data-change-budget-label]').textContent='上会预算Δ（'+(vehicle?'元/车':'元/件')+'）';
    row.querySelector('[data-change-final-label]').textContent='落地价差Δ（'+(vehicle?'元/车':'元/件')+'）';
  }

  }
}
function updateChangePartMatch(input, fillName) {
  const project=getActiveProject(),entry=input.closest('[data-change-item]');if(!project || !entry)return;
  const match=changePartMatch(project,input.value),baseline=aggregateBom(project).find(row=>row.partNumber===match.number);
  const hint=entry.querySelector('[data-change-match]');
  if(hint)hint.textContent=!match.number?'填写零件号可自动匹配名称和各配置用量。':match.row?'已匹配当前 BOM，名称、领域和装车用量已带入。':'当前 BOM 未找到此零件号，可手动填写名称和用量。';
  const name=entry.querySelector('[data-change-part-name]');
  if(fillName && name && match.row && (!name.value.trim() || name.value===name.dataset.autoMatchedName)){
    name.value=partName(match.number,match.row);name.dataset.autoMatchedName=name.value;
  }
  for(const key of ['category1','category2']){
    const select=entry.querySelector('[data-change-domain="'+key+'"]');if(!select)continue;
    if(match.row){select.value=String(partAttributes(project,match.number)[key] || '');select.dataset.autoMatchedDomain='1';}
    else if(select.dataset.autoMatchedDomain){select.value='';delete select.dataset.autoMatchedDomain;}
  }
  for(const item of entry.querySelectorAll('[data-change-quantity-item]')){
    const quantity=item.querySelector('[data-change-quantity]');
    if(baseline){quantity.value=baseline.quantityByVariant[item.dataset.variant] ?? 0;quantity.readOnly=true;quantity.dataset.autoMatchedQuantity='1';}
    else{if(quantity.dataset.autoMatchedQuantity)quantity.value='';quantity.readOnly=false;delete quantity.dataset.autoMatchedQuantity;}
  }
}

async function saveChangeForm(formData) {
  if (changeSaveInProgress) return;
  changeSaveInProgress = true;
  const form = typeof document !== 'undefined' ? document.querySelector('#changeForm') : null;
  const submitButton = form ? form.querySelector('[data-action="submit-dialog-form"]') : null;
  const oldLabel = submitButton ? submitButton.textContent : '';
  if (submitButton) { submitButton.disabled = true; submitButton.textContent = '保存中…'; }
  try {
    const project = getActiveProject();
    const changeId = String(formData.get('changeId') || '');
    const existing = changeId ? project.changes.find(item => item.changeId === changeId) : null;
    if (changeId && !existing) throw new Error('找不到原变更记录。');
    const oldScreenshot = existing && existing.meeting && existing.meeting.screenshot;
    const screenshot = await readMeetingScreenshot(formData.get('meetingScreenshot'),oldScreenshot);
    const result = buildChangeRecord(project,formData,existing,screenshot,nowIso());
    const before = existing ? changeAuditCopy(existing) : null;
    const after = {change:changeAuditCopy(result.change),priceRecords:result.priceRecords};
    await commitMutation({projectId:project.id,entityType:'costChange',entityId:result.change.changeId,action:existing ? 'update' : 'create',partNumbers:result.change.items.map(item => item.partNumber).filter(Boolean),before,after,note:'保存变更状态、配置价格与会议记录'},() => {
      if (existing) project.changes[project.changes.indexOf(existing)] = result.change;
      else project.changes.push(result.change);
      project.prices.push(...result.priceRecords);
    });
    closeDialog(); render();
    showToast(result.change.costBomEntry?'变更已保存；已包含在最新 Cost BOM 中，不额外叠加。':'变更已保存；尚未进入 Cost BOM，价差计入当前成本。');
  } catch (error) { showChangeFormError(error.message || '变更未保存，请检查填写内容。'); }
  finally {
    changeSaveInProgress = false;
    if (submitButton) { submitButton.disabled = false; submitButton.textContent = oldLabel; }
  }
}

function changeSummaryAmount(project,variantId,changes) {
  const parts=summarizeVariant(project,variantId).parts;
  let total=0;
  for(const change of changes) for(const item of change.items || []) {
    const price=changeVariantPrice(item,variantId);
    if(!price)return null;
    const raw=price.finalPrice!=null?price.finalPrice:price.budget;
    if(raw==null || !Number.isFinite(Number(raw)))return null;
    if(change.budgetBasis==='vehicleDelta'){total+=Number(raw);continue;}
    const part=parts.find(row=>row.partNumber===item.partNumber);
    if(part && !part.quantity && part.fitmentByVariant)continue;
    const quantity=part && part.quantity ? Number(part.quantity) : price.quantity!=null ? Number(price.quantity) : null;
    if(quantity==null || !Number.isFinite(quantity) || quantity<=0)return null;
    total+=Number(raw)*quantity;
  }
  return total;
}

function buildRiskRecord(project,formData,existing) {
  const entryDate=String(formData.get('entryDate') || existing?.entryDate || (existing?.createdAt ? dateInputValue(new Date(existing.createdAt)) : dateInputValue())).trim();
  const parsedEntryDate=new Date(entryDate+'T00:00:00');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(entryDate) || !Number.isFinite(parsedEntryDate.getTime()) || dateInputValue(parsedEntryDate)!==entryDate)throw new Error('请填写有效的录入日期。');
  const variantIds=Array.from(new Set(formData.getAll('variantIds').map(String)));
  if(!variantIds.length || variantIds.some(id=>!project.variants.some(variant=>variant.id===id)))throw new Error('请至少选择一个影响的车型配置。');
  const description=String(formData.get('description') || '').trim(),owner=String(formData.get('owner') || '').trim(),level=String(formData.get('level') || '');
  if(!description || !owner)throw new Error('请填写风险描述和责任人。');

  if(itemIds.length){

      const partNumber=normalPartNumber(formData.get('riskPartNumber:'+itemId) || '').value;
      const match=changePartMatch(project,partNumber);
      const name=String(formData.get('riskPartName:'+itemId) || '').trim() || (match.row?partName(partNumber,match.row):'');
      if(!name)throw new Error('请填写零件名称，或填写能匹配 Cost BOM 的零件号。');
      const variantAmounts={};
      for(const id of variantIds){const amount=numberValue(formData.get('riskAmount:'+itemId+':'+id));if(amount==null)throw new Error('请为每个勾选配置填写有效的潜在价差Δ。');variantAmounts[id]=amount;}
      items.push({itemId,partNumber,partName:name,variantAmounts});
    }
  }else{
    // Compatibility with earlier saved forms and records.
    const amount=numberValue(formData.get('potentialIncrease'));if(amount==null)throw new Error('请填写有效的潜在价差Δ。');
    const partNumber=String(formData.get('partNumber') || '').trim(),match=changePartMatch(project,partNumber);
    items.push({itemId:'legacy',partNumber,partName:String(formData.get('partName') || '').trim() || (match.row?partName(partNumber,match.row):partNumber),variantAmounts:Object.fromEntries(variantIds.map(id=>[id,amount]))});
  }
  const now=nowIso(),risk=existing?clone(existing):{riskId:newId(),resolved:false,createdAt:now,progress:[]};
  Object.assign(risk,{entryDate,description,owner,level,variantIds,items,updatedAt:now,partNumber:items[0].partNumber,partName:items[0].partName});
  risk.variantAmounts=Object.fromEntries(variantIds.map(id=>[id,riskVariantAmount(risk,id)]));
  const values=Object.values(risk.variantAmounts);risk.potentialIncrease=values.every(value=>value===values[0])?values[0]:null;
  const text=String(formData.get('progress') || '').trim();
  if(!existing && !text)throw new Error('请填写当前进度。');
  risk.progress=risk.progress || [];
  if(text && (!existing || text!==riskProgressEntries(risk).at(-1)?.text))risk.progress.push({progressId:newId(),date:dateInputValue(),text,resolved:!!risk.resolved,recordedAt:now});
  return risk;
}

function riskProgressDate(value) {
  const date=String(value || '').trim(),parsed=new Date(date+'T00:00:00');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(parsed.getTime()) || dateInputValue(parsed)!==date)throw new Error('请填写有效的进度日期。');
  return date;
}
function buildRiskProgressUpdate(risk,formData) {
  const now=nowIso(),after=clone(risk),managed=formData.get('manageProgress')==='1';
  let edited=0,deleted=0,added=0;after.progress=after.progress || [];
  if(managed){
    if(String(formData.get('progressSnapshot'))!==JSON.stringify(risk.progress || []))throw new Error('进度已发生变化，请关闭后重新打开，再保存修改。');
    const expected=riskProgressEntries(risk).map(entry=>String(risk.progress.indexOf(entry)));
    const indexes=formData.getAll('progressEntryIndexes').map(String);
    if(indexes.length!==expected.length || new Set(indexes).size!==indexes.length || indexes.some(index=>!expected.includes(index)))throw new Error('历史进度不完整，请重新打开后修改。');
    for(const index of indexes){
      const entry=after.progress[Number(index)];
      if(formData.get('deleteProgress:'+index)==='on'){entry.deletedAt=now;entry.updatedAt=now;deleted++;continue;}
      const date=riskProgressDate(formData.get('progressDate:'+index)),text=String(formData.get('progressText:'+index) || '').trim();
      if(!text || text.length>1000)throw new Error('历史进展描述不能为空，且不能超过1000字。');
      if(date!==entry.date || text!==entry.text){entry.date=date;entry.text=text;entry.updatedAt=now;edited++;}
    }
  }
  const text=String(formData.get('progress') || '').trim();
  if(text.length>1000)throw new Error('进展描述不能超过1000字。');
  if(text){after.progress.push({progressId:newId(),date:riskProgressDate(formData.get('progressDate') || dateInputValue()),text,resolved:!!risk.resolved,recordedAt:now});added++;}
  else if(!managed)throw new Error('请填写本周进展 / 下一步。');
  const changed=!!(edited || deleted || added);
  if(changed)after.updatedAt=now;
  return {after,changed,note:'维护风险进度：新增'+added+'条，修改'+edited+'条，删除'+deleted+'条'};
}

async function verifyAuditChain() {
  let previousHash = null;
  const failures = [];
  for (let index = 0; index < appState.auditEvents.length; index++) {
    const event = appState.auditEvents[index];
    if ((event.previousHash || null) !== previousHash) failures.push(index + 1);
    const copy = clone(event);
    const recordedHash = copy.eventHash;
    delete copy.eventHash;
    const expectedHash = await sha256Hex(textEncoder.encode(canonical(copy)));
    if (recordedHash !== expectedHash) failures.push(index + 1);
    previousHash = event.eventHash;
  }
  return {ok:failures.length === 0,count:appState.auditEvents.length,failures:Array.from(new Set(failures))};
}

function getOccurrences(project){
 if(!project)return [];

}
function aggregateBom(project){
 const result=aggregateBomBase(project),source=getOccurrences(project);
 for(const row of result){
  const occurrences=source.filter(item=>item.partNumber===row.partNumber);
  row.engineering=occurrences;
  row.fitmentByVariant={};row.optionalQuantityByVariant={};
  for(const variant of project.variants || []){
   const marks=new Set();let optional=0;
   for(const item of occurrences){
    const mark=String(item.fitments?.[variant.id] || '').toUpperCase();
    if(mark==='S' || (!mark && Number(item.variantQuantities?.[variant.id])>0))marks.add('S');
    if(mark==='O'){marks.add('O');optional+=Number(item.baseQuantity || 0);}
   }
   row.fitmentByVariant[variant.id]=marks.size?Array.from(marks).sort().reverse().join('+'):'-';
   row.optionalQuantityByVariant[variant.id]=optional;
  }
 }
 return result;
}
function engineeringMap(rows){
 const map=costSnapshotMap(rows);
 for(const [number,entry]of map){
  const source=(rows || []).filter(row=>row.partNumber===number);
  entry.fitments={};
  for(const row of source)for(const [id,mark]of Object.entries(row.fitments || {})){entry.fitments[id]=entry.fitments[id] || [];if(!entry.fitments[id].includes(mark))entry.fitments[id].push(mark);}
  for(const id of Object.keys(entry.fitments))entry.fitments[id].sort();
  entry.baseQuantities=source.map(row=>row.baseQuantity??null).sort((a,b)=>Number(a)-Number(b));
  entry.names.sort();entry.units.sort();entry.metadata.sort((a,b)=>canonical(a).localeCompare(canonical(b)));
 }
 return map;
}
function engineeringChanges(beforeRows,afterRows,withPrices){

 for(const number of new Set([...before.keys(),...after.keys()])){
  const old=before.get(number)||null,next=after.get(number)||null,fields=[];
  if(old&&next){
   for(const [key,label]of [['names','零件名称'],['units','单位'],['quantities','标配装车用量'],['fitments','S/O/-配置标记'],['baseQuantities','公共用量'],['metadata','层级/系统/尺寸/开发策略/工程师/分类/供应商']])if(canonical(old[key])!==canonical(next[key]))fields.push({key,label,before:old[key],after:next[key]});
   if(withPrices)for(const [stage,label]of [['target','目标单价'],['nomination','定点单价'],['current','当前单价'],['sop','SOP单价']])if((old.prices[stage]??null)!==(next.prices[stage]??null))fields.push({key:'price:'+stage,label,before:old.prices[stage]??null,after:next.prices[stage]??null});
  }
  if(!old||!next||fields.length)changes.push({diffId:newId(),partNumber:number,type:!old?'新增':!next?'移除':'变更',before:old,after:next,fields});
 }

}

  entry.cell.addEventListener('click',event=>{
   if(event.target.closest('button,input,select,textarea,a'))return;
   if(event.shiftKey){event.preventDefault();tool.selection.r2=entry.r;tool.selection.c2=entry.c;}
   else tool.selection={r:entry.r,c:entry.c,r2:entry.r,c2:entry.c};
   tool.scope=entry.r<headerCount?'cols':'cells';bar.querySelector('[data-tt="scope"]').value=tool.scope;
   bar.querySelector('[data-tt="row"]').value=String(entry.r);bar.querySelector('[data-tt="column"]').value=String(entry.c);tableToolSelection(tool);
  });
 });
 bar.addEventListener('click',event=>{
  const button=event.target.closest('[data-tt-action]');if(!button)return;event.preventDefault();event.stopPropagation();tableToolAction(tool,button.dataset.ttAction,button.dataset.value);
 });
 bar.addEventListener('change',event=>{
  event.stopPropagation();const field=event.target.dataset.tt;
  if(field==='scope'){tool.scope=event.target.value;tableToolSelection(tool);}
  if(field==='row'||field==='column'){const r=Number(bar.querySelector('[data-tt="row"]').value),c=Number(bar.querySelector('[data-tt="column"]').value);tool.selection={r,c,r2:r,c2:c};tableToolSelection(tool);}
  if(field==='font')tableToolAction(tool,'font');
  if(field==='filter-column')tableToolFilterControls(tool);
 });
 bar.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();event.stopPropagation();if(event.target.dataset.tt==='filter-value')tableToolAction(tool,'filter');}});
 tableToolApply(tool);tableToolSelection(tool);tableToolFilterControls(tool);
}
function tableToolBounds(tool) {
 const s=tool.selection;return {r1:Math.min(s.r,s.r2),r2:Math.max(s.r,s.r2),c1:Math.min(s.c,s.c2),c2:Math.max(s.c,s.c2)};
}
function tableToolSelected(tool,entry) {
 const b=tableToolBounds(tool),row=entry.r<=b.r2&&entry.r+entry.rowSpan>b.r1,col=entry.c<=b.c2&&entry.c+entry.span>b.c1;
 return tool.scope==='all'||(tool.scope==='rows'?row:tool.scope==='cols'?col:row&&col);
}
function tableToolSelection(tool) {
 tool.model.entries.forEach(entry=>entry.cell.classList.toggle('tt-selected',tableToolSelected(tool,entry)));
 const b=tableToolBounds(tool);tool.bar.querySelector('.tt-selection').textContent=tool.scope==='all'?'已选整表':'已选：'+(tool.scope==='cols'?'第 '+(b.c1+1)+'–'+(b.c2+1)+' 列':tool.scope==='rows'?'第 '+(b.r1+1)+'–'+(b.r2+1)+' 行':'R'+(b.r1+1)+'C'+(b.c1+1)+' – R'+(b.r2+1)+'C'+(b.c2+1));
}
function tableToolMatch(text,filter) {
 const value=String(text??'').trim(),needle=String(filter.value??'').trim();
 if(filter.mode==='empty')return !value;
 if(filter.mode==='notempty')return !!value;
 if(filter.mode==='equals')return value.toLocaleLowerCase()===needle.toLocaleLowerCase();
 if(filter.mode==='gte'||filter.mode==='lte'){const a=Number(value.replace(/[,，￥¥%\s]/g,'')),b=Number(needle.replace(/[,，￥¥%\s]/g,''));return value!==''&&needle!==''&&Number.isFinite(a)&&Number.isFinite(b)&&(filter.mode==='gte'?a>=b:a<=b);}
 return value.toLocaleLowerCase().includes(needle.toLocaleLowerCase());
}
function tableToolFilterControls(tool) {
 const c=tool.bar.querySelector('[data-tt="filter-column"]').value,filter=tool.state.filters[c];
 tool.bar.querySelector('[data-tt="filter-mode"]').value=filter?.mode||'contains';tool.bar.querySelector('[data-tt="filter-value"]').value=filter?.value||'';
}
function tableToolSafeFormat(format) {
 const result={};for(const [prop,value]of Object.entries(format||{})){
  if(prop==='fontFamily'&&['Microsoft YaHei','SimSun','SimHei','Arial','Calibri','Times New Roman'].includes(value))result[prop]=value;
  if(prop==='fontSize'&&/^\d+px$/.test(value)&&parseInt(value)>=8&&parseInt(value)<=72)result[prop]=value;
  if(['backgroundColor','color'].includes(prop)&&/^#[0-9a-f]{6}$/i.test(value))result[prop]=value;
  if(prop==='textAlign'&&['left','center','right'].includes(value))result[prop]=value;
 }return result;
}
function tableToolApply(tool) {
 const {table,state,model,rowIds,headerCount}=tool;let visible=0,total=0;
 const colgroup=tool.colgroup||document.createElement('colgroup');
 if(!tool.colgroup){table.prepend(colgroup);tool.colgroup=colgroup;}
 const visibleColumns=Array.from({length:model.count},(_,c)=>c).filter(c=>!state.hiddenCols.includes(c));
 const fitRisk=table.classList.contains('risk-table'),riskWidths=[85,340,110,120,230,80,260,155];
 const riskWeight=c=>{const width=Number(state.widths[c]);return width>=40&&width<=1600?width:riskWidths[c]||140;};
 const riskTotal=visibleColumns.reduce((sum,c)=>sum+riskWeight(c),0)||1;
 colgroup.replaceChildren(...visibleColumns.map(c=>{const col=document.createElement('col'),width=Number(state.widths[c]);col.style.width=fitRisk?(riskWeight(c)/riskTotal*100)+'%':width>=40&&width<=1600?width+'px':'';return col;}));
 table.style.tableLayout=fitRisk||Object.keys(state.widths).length?'fixed':'';
 const explicit=Array.from({length:model.count},(_,c)=>state.hiddenCols.includes(c)?0:Number(state.widths[c])||140).reduce((a,b)=>a+b,0);
 table.style.width=fitRisk?'100%':Object.keys(state.widths).length?explicit+'px':'';table.style.minWidth=fitRisk||Object.keys(state.widths).length?'0':'';
 Array.from(table.rows).forEach((row,r)=>{
  const mergedEmpty=row.cells.length===1&&row.cells[0].colSpan>1;
  const filtered=r>=headerCount&&!mergedEmpty&&Object.entries(state.filters).some(([c,filter])=>!tableToolMatch(model.grid[r]?.[c]?.cell.dataset.ttLabel||'',filter));
  row.classList.toggle('tt-hidden-row',state.hiddenRows.includes(rowIds[r])||filtered);
  if(r>=headerCount&&!mergedEmpty){total++;if(!row.classList.contains('tt-hidden-row'))visible++;}
 });
 model.entries.forEach(entry=>{
  const {cell,r,c,span,wrapper}=entry,id=rowIds[r],cellKey=id+':'+c;
  cell.setAttribute('style',entry.original);
  const format=tableToolSafeFormat({...state.formats.all,...state.formats.cols[c],...state.formats.rows[id],...state.formats.cells[cellKey]});
  const elements=[cell,...wrapper.querySelectorAll('span,div,strong,b,a,small')];
  // Remove only formatting previously applied by this layer; retain the original business styles.
  for(const child of elements.slice(1)){if(child.dataset.ttPainted){child.setAttribute('style',child.dataset.ttOriginal||'');delete child.dataset.ttPainted;}}
  for(const [prop,value]of Object.entries(format)){
   const css=prop.replace(/[A-Z]/g,m=>'-'+m.toLowerCase());cell.style.setProperty(css,value,'important');
   if(prop!=='backgroundColor')for(const child of elements.slice(1)){if(!child.dataset.ttPainted){child.dataset.ttOriginal=child.getAttribute('style')||'';child.dataset.ttPainted='1';}child.style.setProperty(css,value,'important');}
  }
  const height=Number(state.heights[id]);wrapper.style.maxHeight=height>=20&&height<=600?(height-8)+'px':'';wrapper.style.overflow=height>=20?'hidden':'';
  if(height>=20&&height<=600){cell.style.height=height+'px';cell.style.paddingTop='4px';cell.style.paddingBottom='4px';}
  const width=Number(state.widths[c]);if(!fitRisk&&span===1&&width>=40&&width<=1600){cell.style.width=width+'px';cell.style.minWidth='0';cell.style.maxWidth=width+'px';cell.style.overflowWrap='anywhere';}
  const visibleSpan=Array.from({length:span},(_,i)=>c+i).filter(index=>!state.hiddenCols.includes(index)).length;
  cell.colSpan=Math.max(1,visibleSpan);
  cell.classList.toggle('tt-hidden-col',visibleSpan===0);
  const button=cell.querySelector('.tt-filter-button');if(button)button.classList.toggle('tt-filter-active',!!state.filters[c]);
 });
 const filters=Object.keys(state.filters).length;
 tool.bar.querySelector('.tt-status').textContent='显示 '+visible+' / '+total+' 行'+(filters?' · '+filters+' 列筛选':'')+(state.hiddenCols.length?' · 隐藏 '+state.hiddenCols.length+' 列':'')+(state.hiddenRows.length?' · 隐藏 '+state.hiddenRows.length+' 行':'')+(tool.saved?'':' · 本次设置暂存，浏览器无法持久保存');
 tableToolSelection(tool);
}
function tableToolAction(tool,action,value) {
 const {state,bar,model,rowIds}=tool,b=tableToolBounds(tool),read=name=>bar.querySelector('[data-tt="'+name+'"]').value;
 const rows=tool.scope==='all'?rowIds.map((_,i)=>i):Array.from({length:b.r2-b.r1+1},(_,i)=>b.r1+i);
 const cols=tool.scope==='all'?Array.from({length:model.count},(_,i)=>i):Array.from({length:b.c2-b.c1+1},(_,i)=>b.c1+i);
 const numeric=(name,min,max)=>{const n=Number(read(name));if(!Number.isFinite(n)||n<min||n>max){bar.querySelector('[data-tt="'+name+'"]').reportValidity();return null;}return Math.round(n);};
 let format=null;
 if(action==='font')format={fontFamily:read('font')};
 if(action==='size'){const n=numeric('size',8,72);if(n==null)return;format={fontSize:n+'px'};}
 if(action==='fill')format={backgroundColor:read('fill')};
 if(action==='color')format={color:read('color')};
 if(action==='align')format={textAlign:value};
 if(format){
  const update=(map,key)=>{map[key]={...map[key],...format};};
  // A broad selection supersedes older cell overrides for the properties being changed.
  for(const entry of model.entries.filter(entry=>tableToolSelected(tool,entry))){const cellKey=rowIds[entry.r]+':'+entry.c;for(const prop of Object.keys(format)){if(state.formats.cells[cellKey])delete state.formats.cells[cellKey][prop];if(tool.scope==='all'){if(state.formats.rows[rowIds[entry.r]])delete state.formats.rows[rowIds[entry.r]][prop];if(state.formats.cols[entry.c])delete state.formats.cols[entry.c][prop];}if(tool.scope==='cols'&&state.formats.rows[rowIds[entry.r]]){state.formats.cells[cellKey]={...state.formats.cells[cellKey],...format};}}}
  if(tool.scope==='all')Object.assign(state.formats.all,format);
  else if(tool.scope==='rows')rows.forEach(r=>update(state.formats.rows,rowIds[r]));
  else if(tool.scope==='cols')cols.forEach(c=>update(state.formats.cols,c));
  else model.entries.filter(entry=>tableToolSelected(tool,entry)).forEach(entry=>update(state.formats.cells,rowIds[entry.r]+':'+entry.c));
 }
 if(action==='clear-format'){
  // Clear the selected cells' appearance, including inherited table/column/row formatting.
  const clean={fontFamily:null,fontSize:null,color:null,backgroundColor:null,textAlign:null};
  model.entries.filter(entry=>tableToolSelected(tool,entry)).forEach(entry=>{state.formats.cells[rowIds[entry.r]+':'+entry.c]={...clean};});
  if(tool.scope==='all')state.formats={all:{},rows:{},cols:{},cells:{}};
 }
 if(action==='hide-rows')rows.filter(r=>r>=tool.headerCount).forEach(r=>{if(!state.hiddenRows.includes(rowIds[r]))state.hiddenRows.push(rowIds[r]);});
 if(action==='hide-cols')cols.forEach(c=>{if(!state.hiddenCols.includes(c))state.hiddenCols.push(c);});
 if(action==='show-all'){state.hiddenRows=[];state.hiddenCols=[];}
 if(action==='height'){const n=numeric('height',20,600);if(n==null)return;rows.forEach(r=>state.heights[rowIds[r]]=n);}
 if(action==='width'){const n=numeric('width',40,1600);if(n==null)return;cols.forEach(c=>state.widths[c]=n);}
 if(action==='auto-size'){rows.forEach(r=>delete state.heights[rowIds[r]]);cols.forEach(c=>delete state.widths[c]);}
 if(action==='filter'){const c=read('filter-column'),mode=read('filter-mode'),text=read('filter-value');if(text.trim()||['empty','notempty'].includes(mode))state.filters[c]={mode,value:text};else delete state.filters[c];}
 if(action==='clear-column-filter'){delete state.filters[read('filter-column')];tableToolFilterControls(tool);}
 if(action==='clear-filters'){state.filters={};tableToolFilterControls(tool);}
 if(action==='reset'){tool.state=tableToolState();tableToolFilterControls(tool);}
 tableToolSave(tool);tableToolApply(tool);
}
function setupTableTools() {
 const enhance=root=>{if(root.nodeType!==1)return;if(root.matches('table'))tableToolInit(root);root.querySelectorAll('table').forEach(tableToolInit);};
 const observer=new MutationObserver(records=>{for(const record of records)for(const node of record.addedNodes)enhance(node);});
 observer.observe(document.body,{childList:true,subtree:true});document.querySelectorAll('table').forEach(tableToolInit);
}

function addListeners() {
  setupTableTools();
  document.addEventListener('click', event => { handleClick(event); });
  window.addEventListener('resize',scheduleFieldAlignment);
  document.addEventListener('toggle',scheduleFieldAlignment,true);
  if(typeof ResizeObserver==='function'){
    fieldAlignmentObserver=new ResizeObserver(scheduleFieldAlignment);fieldAlignmentObserver.observe($('#dialogBody'));
  }
  new MutationObserver(scheduleFieldAlignment).observe($('#dialogBody'),{childList:true,subtree:true});
  document.addEventListener('submit', event => { onSubmit(event); });
  document.addEventListener('change', event => { onChange(event); scheduleFieldAlignment(); });
  document.addEventListener('input', event => { scheduleFieldAlignment(); if(event.target.matches && event.target.matches('[data-risk-part-number]'))updateRiskPartMatch(event.target); if (event.target.matches && event.target.matches('[data-change-part-number]')) updateChangePartMatch(event.target,false); if (event.target.closest && event.target.closest('#changeForm')) updateChangeFormAutoStatus(); });
  $('#backupFile').addEventListener('change', event => openWorkspaceBackup(event.target.files && event.target.files[0]));
  $('#ebomFile').addEventListener('change', event => beginEbomImport(event.target.files && event.target.files[0]));
  $('#dialog').addEventListener('click', event => { if (event.target === $('#dialog')) closeDialog(); });
  window.addEventListener('beforeunload', event => {
    if (appState && (persistenceMode !== 'indexeddb' || pendingWrites > 0)) { event.preventDefault(); event.returnValue = ''; }
  });
}
addListeners();
initializeBoot();
</script>
